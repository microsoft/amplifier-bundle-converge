bundle:
  name: converge-behavior
  version: 0.1.0
  description: >-
    Vision-first, contract-driven development — the composable capability
    package. Adds converge's four agents (protocol-authority, reconciler,
    negotiator, proposal-drafter), its five procedure skills (via tool-skills),
    the hooks-candidate-guard tool:pre hook (structural PROTOCOL.md §5
    enforcement, on by default), and the thin always-on awareness context. THE
    install path:
      amplifier bundle add git+https://github.com/microsoft/amplifier-bundle-converge@main#subdirectory=behaviors/converge.yaml --app
    Composes onto whatever bundle is already active. That host supplies the
    session base and the everyday tools; Converge's own recipe needs a host on
    the lean anchors base (see README.md "Install"). Includes the work-tracker
    BEHAVIOR (so converge:reconciler gets its work_* filing tools on BOTH
    install paths); brings no base bundle of its own.

includes:
  # The work-tracker BEHAVIOR (not a root bundle) supplies converge:reconciler's
  # work_list / work_add / work_file tools. Behavior-includes-behavior is the
  # standard ecosystem pattern (context-intelligence, dot-graph, digital-twin-
  # universe all do it). Including it HERE closes the --app gap: the behavior-only
  # install now gets tracker filing too, not just the full-workspace root path.
  # Same URI form bundle.md consumes, so composition dedupes to one instance.
  - bundle: git+https://github.com/microsoft/amplifier-work-tracker@main#subdirectory=behaviors/work-tracker.yaml

# Namespace note (verified against foundation registry.py:467-523): loading this
# file via `#subdirectory=behaviors/converge.yaml` also loads the sibling root
# bundle.md (name: converge), which registers `@converge:` -> the repo CHECKOUT
# ROOT. So every `converge:` / `@converge:` ref below resolves to repo-root/agents,
# /context, /skills — NOT to behaviors/. This is exactly the work-tracker pattern
# (root name `work-tracker`, behavior name `work-tracker-behavior`, refs use the
# root name). This behavior is deliberately named `converge-behavior` (distinct
# from the root `converge`) so it does not shadow the root namespace.

tools:
  # Register converge's five skills with tool-skills so load_skill() finds them
  # in a composed session. A host base ships the tool-skills MODULE (so load_skill
  # exists) but points config.skills only at its own skills dirs — without this
  # block converge's skills are DISCOVERABLE but not COMPOSED (the same
  # discovery != composition trap as agents). A top-level `skills:` key is
  # silently ignored; this tool-skills config.skills list is the sanctioned wiring.
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "@converge:skills"

hooks:
  # The ratchet's teeth (mechanism-spec §6.1 DECIDED: BUILD). Structural
  # enforcement of PROTOCOL.md §5, pillar 3: no direct write/edit/patch/bash-write
  # to a locked contract/VISION.md; amendments land only via a ratified sibling
  # proposal — `<contract>.vN-candidate.md` (contracts/documents.v1 clause 8) or
  # the legacy `CANDIDATE-<topic>.md` (PROTOCOL.md §5), both admitted. On by
  # default (a guard that ships off recreates the convention-only gap the
  # behavioral model proved insufficient, OQ2).
  #
  # Every value below is a deliberate restatement of the module's own default,
  # kept BYTE-IDENTICAL to it. They drifted apart once — the module learned the
  # versioned proposal name and the H1 locked marker while this file did not —
  # and that drift is why converge-diw / -9vw / -ksg were each filed separately.
  # modules/hooks-candidate-guard/tests/test_guard.py asserts the two agree --
  # on frozen_marker_regex, always_allow_globs, candidate_glob AND guarded_globs.
  #
  # Two of those values moved on 2026-09-03 (converge-dwi), in BOTH places at
  # once:
  #   - frozen_marker_regex: the H1 branch now reads `(RATIFIED` as well as
  #     `(FROZEN`. The body branch already accepted `**Status:** RATIFIED`, so
  #     the same status word read as LOCKED in the body and UNLOCKED in the H1
  #     — while contracts/documents.v1 clause 6 mandates the H1 form.
  #   - guarded_globs: `docs/PROTOCOL.md` / `PROTOCOL.md` join VISION. Without
  #     it the live instance — docs/PROTOCOL.md, whose H1 reads
  #     `... Protocol v3 (RATIFIED 2026-09-03)` — was not guarded at all.
  #
  # Module source is RELATIVE TO THIS FILE'S DIRECTORY (behaviors/), verified
  # against foundation's FileSource + the work-tracker behavior's own comment:
  # `../modules/...` is correct (-> repo-root/modules); `./modules/...` silently
  # resolves to behaviors/modules/ and the module never loads. On publish this
  # still resolves because relative sources bind to the behavior file's dir.
  - module: hooks-candidate-guard
    source: ../modules/hooks-candidate-guard
    config:
      enabled: true
      guarded_globs: ["contracts/*.md", "contracts/**/*.md", "docs/VISION.md", "VISION.md", "docs/PROTOCOL.md", "PROTOCOL.md"]
      require_frozen_marker: true
      frozen_marker_regex: '(?im)^\*\*Status:\*\*\s*(?:RATIFIED|FROZEN)|^status:\s*FROZEN|^#.*\((?:FROZEN|RATIFIED)\b'
      always_allow_globs: ["**/CANDIDATE-*.md", "**/*.v[0-9]*-candidate.md"]
      intercept_tools: ["write_file", "edit_file", "apply_patch"]
      tool_name_aliases: ["Write", "Edit", "MultiEdit"]
      path_fields: ["file_path", "path"]
      scan_bash: true
      bash_tool_name: "bash"
      escape_mode: "ratified_candidate"        # ratified_candidate | token | both
      candidate_glob: ["**/CANDIDATE-*.md", "**/*.v[0-9]*-candidate.md"]
      ratified_stamp_regex: '(?im)^ratified(?:\s+as\s+edited)?\b.*\bby\s+owner\b'
      candidate_target_field: "target"
      # Break-glass emergency-unlock keys omitted on purpose: GuardConfig's own
      # defaults (allow_emergency_unlock=false, unlock path=.converge/UNLOCK) already
      # give the intended off-by-default behavior. Not restating them keeps the
      # config minimal and avoids a path literal that secret-scanners keep
      # misreading. See modules/hooks-candidate-guard/README.md to enable it.
      fail_closed_on_error: true
      enforce_encode_before_impl: false        # rule (b), opt-in — see hooks-candidate-guard-spec §4.6

agents:
  # Compose converge's four agents into coordinator.config["agents"]. Without an
  # agents: block the agents are DISCOVERABLE (`amplifier agents show`) but never
  # COMPOSED, so recipe execution fails "Agent 'converge:reconciler' not found in
  # configuration". Discovery != composition (live-verified, DTU increment 1).
  include:
    - converge:reconciler
    - converge:protocol-authority
    - converge:negotiator
    - converge:proposal-drafter

modes:
  # Declares the manager mode (operation.v1's reference implementation) so this
  # behavior states, in the same place as its agents and skills, that it carries
  # one. Written exactly the way other published bundles write it (verified
  # against amplifier-online's behavior): `<bundle-name>:modes/<file-stem>`, so
  # `converge:modes/converge-manager` names repo-root/modes/converge-manager.md
  # through the root namespace.
  #
  # HONEST SCOPE OF THIS BLOCK (measured 2026-09-02, controlled A/B on the
  # `--app` path, block present vs. block removed, everything else equal —
  # `converge-manager` listed in BOTH runs): this block is a DECLARATION, not
  # the mechanism. Modes reach a session by AUTO-DISCOVERY —
  # hooks-mode's ModeDiscovery._ensure_bundle_discovery walks every composed
  # bundle namespace from the mention_resolver and adds `<base_path>/modes` as a
  # search path when that directory exists (amplifier-bundle-modes,
  # modules/hooks-mode/amplifier_module_hooks_mode/__init__.py:303-372).
  # amplifier_foundation never parses a top-level `modes:` key (its only modes
  # code is validate_modes(), a schema-only scan of `modes/*.md`). Keep the
  # block for intent and convention; do NOT rely on it to make a mode appear,
  # and do NOT conclude a mode is wired just because it is listed here.
  #
  # WHAT ACTUALLY HIDES THE MODE (same session, measured): a duplicate
  # `converge` namespace. A stale converge app bundle whose checkout has no
  # `modes/` directory wins the namespace, `@converge:modes/…` resolves to
  # nothing, and the mode never lists — with or without this block. Dropping the
  # stale registrations made it appear immediately. Filed as converge-348.
  #
  # NOT restated in bundle.md — deliberately. The root already includes this
  # behavior (`- bundle: converge:behaviors/converge`), which is exactly how
  # amplifier-online's root composes its mode: the behavior declares it once and
  # the root inherits it. Restating it there would double-declare the same mode.
  #
  # The mode MACHINERY (tool-mode + hooks-mode) comes from the host: the lean
  # anchors base ships both (bundles/anchors/bundle.md), so the root path has it;
  # on the `--app` path the host session supplies it, same as for agents/skills.
  include:
    - converge:modes/converge-manager

context:
  include:
    - converge:context/converge-awareness.md

# NO top-level `spawn:` block — deliberately (DTU-verified 2026-09-02).
# The live probe this file's old PROPAGATION CAVEAT asked for was run: a
# behavior's top-level `spawn:` DOES merge into the session mount plan via
# `--app`, and `spawn.exclude_tools` then strips the listed tools from EVERY
# spawned sub-agent in EVERY session — not just converge's agents (measured:
# an unrelated session's own read-only helper lost bash/delegate/load_skill;
# functional proof BASH_ABSENT; removal control restored a byte-identical
# baseline). That is unacceptable collateral for a composable
# behavior, so the block was removed everywhere. The agents' "no delegate /
# no skills / no shell" rules are BEHAVIORAL (agent body instructions +
# explicit tools: blocks); the candidate-guard hook remains the structural
# enforcement. Do NOT reintroduce a session-wide spawn policy — per-agent
# spawn tool policy is an upstream feature request.
