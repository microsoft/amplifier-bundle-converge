<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amplifier Converge</title>
<meta name="description" content="Your manager sessions: where each project is going, and how it is going.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FAF6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Converge">
<link rel="icon" href="/static/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-view="home" data-place="direction">

<a class="skip" href="#main">Skip to what this page says</a>

<div class="shell">

  <header class="top">
    <button class="back" id="back" type="button" hidden>All sessions</button>
    <div class="top__who">
      <p class="top__eyebrow">Amplifier Converge</p>
      <h2 class="top__name" id="session-name">Manager Sessions</h2>
    </div>
    <button class="console-toggle" id="console-toggle" type="button" aria-expanded="false" aria-controls="console">
      Console
    </button>
  </header>

  <nav class="places" id="places" hidden aria-label="The two places">
    <button type="button" class="place is-on" data-place="direction">Direction</button>
    <button type="button" class="place" data-place="operation">Operation</button>
  </nav>

  <main id="main">

    <section id="view-home" class="view">
      <h1>Manager Sessions</h1>
      <p class="lede">Sorted by which one needs you.</p>
      <div id="cards" class="cards"></div>
      <p class="foot" id="home-foot"></p>
    </section>

    <section id="view-direction" class="view" hidden>
      <h1>Direction</h1>
      <p class="lede">Where this project is going, and what must be true of it.</p>
      <div id="direction"></div>
    </section>

    <section id="view-operation" class="view" hidden>
      <h1>Operation</h1>
      <p class="lede">Your manager session at work.</p>
      <div id="operation"></div>
    </section>

  </main>

</div>

<aside class="tray" id="console" aria-label="Manager Console" aria-hidden="true">
  <div class="tray__grip" id="tray-grip"></div>
  <header class="tray__top">
    <h2>Manager Console</h2>
    <p class="tray__sub" id="tray-sub">Stays with you across both places.</p>
    <button type="button" class="tray__close" id="tray-close" aria-label="Put the console away">Close</button>
  </header>
  <div class="tray__screen" id="tray-screen"></div>
  <form class="tray__say" id="tray-say">
    <label class="visually-hidden" for="tray-input">Say something to your manager session</label>
    <input id="tray-input" type="text" autocomplete="off" placeholder="Say something…">
    <button type="submit">Send</button>
  </form>
</aside>

<div class="said" id="said" role="status" aria-live="polite"></div>

<script id="boot" type="application/json">__BOOT__</script>
<script src="/vendor/xterm/xterm.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
