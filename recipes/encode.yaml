# =============================================================================
# encode — Converge Phase 2 ENCODE (PROTOCOL.md §4)
# =============================================================================
#
# Takes the owner's ALREADY-RATIFIED Phase-1 negotiation decisions and authors
# `docs/VISION.md` + `contracts/<seam>.v1.md` as DRAFT artifacts, presents them
# for the owner's literal-word ratification at ONE approval gate, then commits
# them before any implementation — the commit being the ratification record.
#
# Mechanism spec: @converge:docs/design/mechanism-spec.md §4.1 (authoritative)
# Protocol:       @converge:docs/PROTOCOL.md §3.1 (VISION genre), §3.2 (contract
#                 anatomy), §5 (Freeze Bar — owner-only), §6 (attention budget)
#
# STAGED / INTERACTIVE / OWNER-GATED — unlike seed-reconcile (flat, unattended),
# encode is a staged recipe with exactly ONE owner-attention surface: the
# `ratify-encoded` gate (§6 attention item #1 — ratify vision/contract changes).
# It does NOT run negotiation (that is the upstream Phase-1 owner+negotiator work
# that produces `negotiated_decisions`), and it NEVER stamps FROZEN (owner-only
# Freeze Bar, §5). encode's job is initial authoring of DRAFTs, committed.
#
# NO SELF-RATIFICATION (pillar 3) — the gate's `required: true` is hardcoded;
# there is deliberately no auto-approve bypass. Only the owner ratifies, in the
# literal word. A machine cannot stand in for that seat.
#
# GATE SEMANTICS (engine truth — RECIPE_SCHEMA.md + executor.py:1352-1421): a
# stage's `approval:` block fires AFTER that stage's own steps complete and
# pauses the transition to the NEXT stage ("pauses execution after this stage
# completes"). It does NOT gate entry to its own stage. So the ratify-encoded
# gate is declared on the `draft` stage — it fires once the DRAFTs are written
# to disk, which is exactly what the owner reviews — and EVERY step that consumes
# the ratification (assert-ratification, apply-ratified-edits, commit-encoded)
# lives in the SEPARATE, following `commit-ratified` stage. Declaring the gate on
# the same stage as its consumers was the v1.0.0 defect (see changelog): those
# steps ran BEFORE the owner was ever asked, against the empty default.
# Gate-on-PRIOR-stage, consumers-in-NEXT-stage is the engine's own passing
# approval-fixture shape (test_approval_gates.py:770-781).
#
# THE THREE HARD CONSTRAINTS (mechanism-spec §4.1 — zero design latitude):
#   1. WITHIN-CWD INVARIANT (increment-1 v1.2.0): every write and the commit
#      target resolves inside the session cwd / {{target_repo}}. cwd IS the
#      workspace; {{target_repo}} defaults to "." (the repo at cwd). No writes
#      outside the workspace — that requires explicit user/environment config.
#   2. DRAFT-ONLY / candidate-guard interplay (increment-2): the
#      `hooks-candidate-guard` hook is composed and ON. DRAFT VISION.md and DRAFT
#      contracts are writable BY DESIGN — the guard only denies writes to files
#      carrying the FROZEN/RATIFIED marker. So the draft step MUST write
#      `**Status:** DRAFT` and MUST NEVER write a FROZEN/RATIFIED marker. If
#      encode ever targeted an already-FROZEN file it would (correctly) be denied
#      — amending a frozen artifact is the CANDIDATE flow, a different mechanism.
#   3. DERIVE NOTHING NEW (pillar 5): encode encodes the owner's ratified
#      decisions; it invents no contract clause or vision content beyond
#      `negotiated_decisions`. A genuinely missing decision is SURFACED TO THE
#      OWNER (intake fails loud naming it; draft refuses to invent; the gate is
#      where the owner sees the gap and declines), never filled in.
#
# "RATIFIED AS EDITED" — handled WITHIN the staged schema (no loop-back verb
# exists). The gate's approval message ({{_approval_message}}) carries the
# owner's literal word plus any named edits, injected on resume into the
# `commit-ratified` stage. That stage runs, in order: `assert-ratification` (fail
# loud if the record is empty — see below), then `apply-ratified-edits`, which
# reads the message and:
#   - plain "ratified" (no edits)      → no-op; drafts commit as-is;
#   - "ratified as edited" + edits     → applies EXACTLY the named edits to the
#                                        DRAFT files before commit-encoded runs.
# A DECLINE never reaches the commit stage at all: the gate's `default: deny`
# stops the recipe at the draft→commit boundary, so nothing is committed.
# (Prompt-driven rather than a `condition:` string because the approval message
# is free-form — equality-style conditions cannot reliably parse a literal-word +
# edits blob.)
#
# FAIL-LOUD ON EMPTY RECORD — an empty {{_approval_message}} reaching the commit
# stage means the gate was bypassed or the engine changed: an AUTHORIZATION
# FAILURE, never an input gap. `assert-ratification` (bash, on_error: fail) stops
# the run before any commit, and commit-encoded refuses an empty record too. The
# v1.0.0 anti-pattern — commit-encoded politely asking for the missing record and
# "completing" with nothing committed — is now impossible.
#
# Executor latitude (the ONE choice the spec leaves open — the
# draft-vision-contracts executor): chosen `foundation:file-ops`. Rationale: it
# is the spec's default AND the anti-scope-designated encode writer (§C #6 —
# "encode writes use foundation:file-ops"). Evaluated alternatives and rejected:
# `converge:reconciler` is write-capable but ledger-domain (wrong artifacts);
# `converge:amendment-drafter` only authors CANDIDATE files and is unbuilt. No
# cleaner equivalent exists, so the default stands. (intake = file-ops read-only
# prep; commit = foundation:git-ops — both fixed by the spec, not latitude.)
#
# Inputs (recipe context):
#   - negotiated_decisions (required) — owner-approved Phase-1 minutes: per call,
#     which seams get contracts; each contract's Core/Backlogged/Conformance/
#     Reserved intent; and the VISION end-state + principles + "deliberately
#     resists" content. Freeform (gap #2: defined content, no rigid schema) —
#     intake normalizes it robustly and fails loud rather than inventing.
#   - target_repo    (optional) default "." — the repo being encoded (cwd or a
#     subdirectory of cwd; within-cwd invariant).
#   - seams          (optional) default "" — derived from negotiated_decisions
#     when blank; one contracts/<seam>.v1.md per seam.
#   - vision_path    (optional) default "docs/VISION.md"
#   - contracts_dir  (optional) default "contracts/"
#
# Outputs:
#   - {{vision_path}} written as DRAFT (genre per PROTOCOL §3.1);
#   - one {{contracts_dir}}/<seam>.v1.md per seam, DRAFT (anatomy per §3.2);
#   - a git commit on {{target_repo}} whose message embeds the ratification
#     record (owner's literal word + any edits, from the gate);
#   - an encode report naming files written, seams covered, and the explicit
#     residual: these are DRAFT — the Freeze Bar (§5) is a later, owner-only act.
#
# Usage: invoke FROM the workspace root (cwd IS the workspace); pass the ratified
# Phase-1 minutes as negotiated_decisions:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@converge:recipes/encode.yaml \
#     context='{"negotiated_decisions": "<ratified Phase-1 minutes>"}'
# The recipe pauses at the ratify-encoded gate; approve with the owner's literal
# word (and any edits) via the recipes `approve` operation to reach the commit.
# =============================================================================
#
# CHANGELOG
# -----------------------------------------------------------------------------
# v1.1.0 (2026-08-30):
#   - CRITICAL FIX: Inverted gate placement — the owner was never asked before
#     the commit steps ran. Caught by live verification (schema validation and
#     result-validator both missed it); root-caused by bug-hunter against the
#     engine source.
#     * ROOT CAUSE (executor.py:1352-1421; RECIPE_SCHEMA.md): a stage's
#       `approval:` gate fires AFTER that stage's own steps complete — it gates
#       the transition to the NEXT stage ("pauses execution after this stage
#       completes"). v1.0.0 declared the gate on the SAME stage
#       (`ratify-and-commit`) that held apply-ratified-edits + commit-encoded, on
#       the inverted belief that a gate fires BEFORE its stage's steps. Live
#       consequence: both steps executed BEFORE the owner was ever asked,
#       substituting the `_approval_message: ""` default; the gate then paused at
#       the stage transition; approve+resume injected the real message
#       (executor.py:1146) into a stage loop with zero stages left (range(3,3)),
#       so it was never consumed. State evidence at pause: completed_steps held
#       both steps; current_stage_index=3.
#     * THE KEY INSIGHT: the engine's own passing fixture
#       (test_approval_gates.py:770-781) declares the gate on the PRIOR stage and
#       puts the consumer steps in the NEXT stage. Gate-on-prior,
#       consumers-in-next is the only correct shape.
#     * FIX: moved the ratify-encoded `approval:` block onto the `draft` stage
#       (fires after the DRAFTs are written = exactly the draft→commit boundary,
#       which is what the owner reviews). Renamed stage 3 `ratify-and-commit` →
#       `commit-ratified` (no approval of its own), holding the consumer steps.
#       Three stages stay three.
#     * FAIL-LOUD GUARD (finding #2): the v1.0.0 live run "completed" having
#       committed nothing because commit-encoded politely asked for the missing
#       record and finished. Added `assert-ratification` as the FIRST step of the
#       commit stage — a bash guard that exits 1 (on_error: fail) if
#       {{_approval_message}} is empty/whitespace. An empty record is an
#       AUTHORIZATION FAILURE, not an input gap. commit-encoded is also now
#       instructed to FAIL on an empty record, never ask-and-finish.
#     * `_approval_message: ""` context declaration STAYS — confirmed NOT causally
#       involved (the engine setdefaults "" at every gate-less stage boundary
#       regardless; the declaration only keeps static validation green; injection
#       at executor.py:1146 overwrites it on resume).
#
# v1.0.0 (2026-08-30):
#   - NEW FEATURE: Initial encode recipe (Converge Phase 2 ENCODE).
#     * Staged, owner-gated: intake → draft → [ratify-encoded gate] → commit.
#     * Authors DRAFT VISION.md + contracts/<seam>.v1.md from the owner's
#       ratified negotiated_decisions; commits with the ratification record.
#     * Honors the three hard constraints: within-cwd invariant, DRAFT-only
#       (candidate-guard interplay — never writes FROZEN/RATIFIED), derive-
#       nothing-new (missing decision surfaced to owner, never invented).
#     * "ratified as edited" handled via a prompt-driven apply-ratified-edits
#       step off {{_approval_message}}; decline stops before any commit.
#     * Draft executor = foundation:file-ops (spec default + anti-scope §C #6);
#       intake = file-ops read-only prep; commit = foundation:git-ops.
# =============================================================================

name: "encode"
description: >
  Converge Phase 2 ENCODE. Authors docs/VISION.md + contracts/<seam>.v1.md as
  DRAFT from the owner's already-ratified Phase-1 negotiation decisions,
  presents them for literal-word ratification at one owner gate, then commits
  them before any implementation — the commit being the ratification record.
  Staged and interactive; never stamps FROZEN; invents nothing beyond the
  ratified decisions.
version: "1.1.0"
author: "converge bundle"
tags: ["converge", "encode", "vision", "contracts", "draft", "ratify", "staged"]

context:
  # --- required (no default — must be supplied at invocation) ---
  negotiated_decisions: ""      # owner-ratified Phase-1 minutes (freeform)
  # --- workspace-relative (overridable; default assumes cwd IS the workspace) ---
  target_repo: "."              # the repo being encoded — cwd or within cwd
  # --- optional (defaults per mechanism-spec §4.1) ---
  seams: ""                     # blank → derived from negotiated_decisions
  vision_path: "docs/VISION.md" # VISION.md location within target_repo
  contracts_dir: "contracts/"   # where <seam>.v1.md contracts are written
  # --- runtime-injected (declared so static validation resolves it; the
  #     ratify-encoded gate OVERRIDES this with the owner's literal ratification
  #     word + edits when the stage is approved) ---
  _approval_message: ""         # owner's ratification message, set by the gate

stages:
  # ===========================================================================
  # STAGE 1: intake — normalize the ratified minutes into a plan (NO writes)
  # ===========================================================================
  - name: "intake"
    steps:
      - id: "intake-decisions"
        agent: "foundation:file-ops"
        timeout: 600
        output: "encode_plan"
        prompt: |
          READ-ONLY normalization step — you WRITE NOTHING to disk in this step.
          You turn the owner's already-ratified Phase-1 minutes into a structured
          ENCODE PLAN that the draft step will author from verbatim.

          Ratified Phase-1 decisions (freeform minutes — defined content, but NO
          rigid schema; normalize robustly):
          {{negotiated_decisions}}

          Target repo: {{target_repo}}   (cwd IS the workspace; stay within it)
          Seams override (optional): {{seams}}

          Produce the ENCODE PLAN as structured prose:

          1. VISION outline — from the decisions, extract the desired end-state
             (written as though already true), the numbered operating principles,
             and the required "What this repo deliberately resists" content
             (PROTOCOL §3.1). Note where VISION should be a THIN POINTER to a
             governing contract rather than restating it.
          2. SEAM → CONTRACT map — the list of seams that get a contract (from
             {{seams}} if provided, else derived from the decisions). For each
             seam, gather its Core / Backlogged (with named promotion triggers) /
             Conformance / Reserved intent (PROTOCOL §3.2). If a feature × surface
             matrix is implied, capture REQUIRED / IDIOM / EXCLUDED entries.
          3. FILE PLAN — the exact paths to be written: {{vision_path}} and one
             {{contracts_dir}}<seam>.v1.md per seam, ALL relative to
             {{target_repo}} and inside cwd. Every one is a DRAFT.

          DERIVE NOTHING NEW — FAIL LOUD (pillar 5): the plan may contain ONLY
          what the decisions actually back. If a required decision is genuinely
          MISSING (a seam named with no Core intent; a VISION with no "resists"
          content; an ambiguous call the minutes never settled), DO NOT invent it
          and DO NOT paper over it. Mark the plan **BLOCKED**, name the missing
          decision precisely, and state that the owner must supply it before
          encode can proceed. A named gap is a real result; a fabricated clause
          is a protocol violation. The gate downstream is where the owner sees a
          BLOCKED plan and declines.

          Output the ENCODE PLAN (or the BLOCKED plan naming the gap) as your
          result. Write no files.

  # ===========================================================================
  # STAGE 2: draft — author the DRAFT VISION + contracts (writes, DRAFT-only)
  #   The ratify-encoded gate is declared HERE (not on the commit stage). Per the
  #   engine's gate semantics (see header), a stage's `approval:` fires AFTER the
  #   stage's steps complete — so this gate fires once the DRAFTs are written,
  #   pausing the transition into `commit-ratified`. That is exactly the
  #   draft→commit boundary the owner reviews. §6 attention item #1; semantics:
  #   validates_previous (the drafts) + authorizes_next (the commit).
  # ===========================================================================
  - name: "draft"
    approval:
      required: true            # hardcoded — NO self-ratification (pillar 3)
      timeout: 0                # wait indefinitely for the owner
      default: "deny"           # absent an owner word, nothing commits
      prompt: |
        RATIFY-ENCODED — owner ratification of the DRAFT vision + contracts
        (owner attention budget §6, item #1). No one but you ratifies, and only
        in the literal word.

        The drafted DRAFT artifacts (review the files on disk in {{target_repo}}
        before answering):
        {{draft_result}}

        Normalized plan they were authored from (check nothing was invented and
        nothing required is missing):
        {{encode_plan}}

        These are DRAFT. Ratifying commits them as the encoded starting point; it
        does NOT stamp FROZEN — the Freeze Bar (§5) is a later, owner-only act.

        Answer with the literal word:
          - "ratified"            — commit the DRAFTs as-is;
          - "ratified as edited: <the exact edits>" — the named edits are applied
            to the DRAFTs, then committed;
          - "declined: <reason>"  — deny; the recipe stops and commits nothing.

        Your message becomes the ratification record embedded in the commit.
    steps:
      - id: "draft-vision-contracts"
        agent: "foundation:file-ops"
        timeout: 1200
        output: "draft_result"
        prompt: |
          Author the DRAFT artifacts in {{target_repo}} from the ENCODE PLAN
          below. You are the encode writer.

          WITHIN-CWD INVARIANT: every file you write resolves inside the session
          cwd / {{target_repo}}. Write nothing outside the workspace.

          DRAFT-ONLY (candidate-guard interplay): the hooks-candidate-guard hook
          is ON. It ALLOWS these writes precisely because they are DRAFT. Every
          file you write MUST carry `**Status:** DRAFT` and MUST NEVER carry a
          FROZEN or RATIFIED marker — stamping FROZEN is an owner-only Freeze Bar
          act (§5), not yours. If a target path already exists FROZEN, do NOT
          attempt to edit it (the guard will deny it, correctly) — report it as a
          conflict; amending a frozen artifact is the CANDIDATE flow, not encode.

          DERIVE NOTHING NEW (pillar 5): author ONLY what the plan backs. If the
          plan is marked BLOCKED or a seam lacks the intent to author its Core,
          do NOT invent content to fill the gap — write what IS backed, SKIP what
          is not, and name each skipped/missing piece in your result so the owner
          sees it at the gate. Refusing to invent is correct behavior here.

          WRITE-DENIAL DOCTRINE: if a write is denied by tool policy, do NOT
          circumvent it (not via bash, not any other tool). In this recipe a
          denial almost always means a FROZEN-path collision (see above) or a
          misconfigured workspace — report the denied path in your result and
          stop that write path honestly.

          Write, per the plan:
          - {{vision_path}} as DRAFT — genre per PROTOCOL §3.1: desired end state
            as though already true · numbered operating principles · required
            "What this repo deliberately resists" · dated changelog — nothing
            else; a thin pointer to a governing contract where one exists.
          - one {{contracts_dir}}<seam>.v1.md per seam as DRAFT — anatomy per
            §3.2: Core (frozen-once-stamped, numbered, small) · Backlogged (with
            named promotion triggers) · Conformance · Reserved · Changelog.

          ENCODE PLAN:
          {{encode_plan}}

          Output your result: the exact list of files written (with their DRAFT
          status confirmed), seams covered, and anything you refused to invent or
          could not write (with the reason) — for the owner to review at the gate.

  # ===========================================================================
  # STAGE 3: commit-ratified — apply owner edits, then commit (NO gate of its own)
  #   The ratify-encoded gate on the `draft` stage has already fired and paused
  #   the transition INTO this stage; on approve+resume the engine injects the
  #   owner's {{_approval_message}} here. This stage consumes it. A decline never
  #   reaches this stage (the gate stops the recipe at the boundary). Order:
  #   assert-ratification (fail loud on empty record) → apply-ratified-edits →
  #   commit-encoded.
  # ===========================================================================
  - name: "commit-ratified"
    steps:
      - id: "assert-ratification"
        type: "bash"
        on_error: "fail"
        output: "ratification_asserted"
        command: |
          set -euo pipefail
          # The gate injects the owner's literal ratification word here on resume.
          # An EMPTY record at this point is an AUTHORIZATION FAILURE — the gate
          # was bypassed or the engine changed — never an input gap. Refuse to
          # proceed to any commit. (Heredoc-captured so arbitrary quotes/newlines
          # in the message can't break the shell.)
          record=$(cat <<'RATIFY_RECORD_EOF'
          {{_approval_message}}
          RATIFY_RECORD_EOF
          )
          if [ -z "$(printf '%s' "$record" | tr -d '[:space:]')" ]; then
            echo "FATAL: empty ratification record — the gate was bypassed or the engine changed; nothing will be committed. An empty record is an authorization failure, not an input gap." >&2
            exit 1
          fi
          printf '%s' "ratification record present — proceeding to commit"

      - id: "apply-ratified-edits"
        agent: "foundation:file-ops"
        timeout: 900
        output: "edits_result"
        prompt: |
          Reconcile the DRAFT artifacts with the owner's ratification message
          before commit. The gate has already been approved; interpret the
          owner's literal word:

          Owner ratification message:
          {{_approval_message}}

          Behavior:
          - If the owner said plain "ratified" (no edits named): make NO changes.
            Report "no edits — drafts unchanged" and stop.
          - If the owner said "ratified as edited" with named edits: apply
            EXACTLY those edits to the DRAFT files in {{target_repo}} — nothing
            more, nothing not named. Keep every file DRAFT (`**Status:** DRAFT`);
            NEVER introduce a FROZEN/RATIFIED marker. Stay within cwd. Do not
            invent content beyond the owner's named edits.

          Same DRAFT-only, within-cwd, and write-denial rules as the draft step
          apply here. Output the exact edits applied (or "no edits"), for the
          commit record.

          Files as drafted:
          {{draft_result}}

      - id: "commit-encoded"
        agent: "foundation:git-ops"
        timeout: 600
        output: "final_output"
        prompt: |
          Commit the ratified DRAFT encode artifacts on {{target_repo}} and emit
          the encode report. This commit IS the ratification record.

          FAIL LOUD ON EMPTY RECORD (do this check FIRST): the ratification
          message below is the owner's authorization. If it is empty or only
          whitespace, the gate was bypassed or the engine changed — this is an
          AUTHORIZATION FAILURE, not an input gap. Do NOT commit, do NOT ask for
          the missing record and finish; FAIL the step, naming the empty record.
          (assert-ratification should already have stopped the run; this is the
          belt-and-suspenders refusal in case it did not.)

          WITHIN-CWD: the commit targets the repo at {{target_repo}} (inside cwd).
          Stage and commit ONLY the encode artifacts: {{vision_path}} and the
          {{contracts_dir}}<seam>.v1.md files (plus any owner-named edits). Do not
          sweep unrelated working-tree changes into this commit.

          Commit message — embed the ratification record verbatim:
          - subject: `encode: DRAFT vision + contracts (ratified)`
          - body: the owner's literal ratification word and any named edits, taken
            from the ratification message below; the list of files committed and
            seams covered; and the explicit residual line: "Artifacts are DRAFT —
            Freeze Bar (PROTOCOL §5) is a later, owner-only act."

          Ratification message (the record to embed):
          {{_approval_message}}

          Edits applied at ratification (if any):
          {{edits_result}}

          Files as drafted:
          {{draft_result}}

          After committing, VERIFY the commit exists (record its SHA) and that the
          committed files carry DRAFT status (a commit that silently stamped
          FROZEN, or that committed nothing, is a real failure — report it, do not
          paper over it).

          Emit the ENCODE REPORT as your final result: files written + committed,
          seams covered, the commit SHA, the ratification record, and the honest
          residual — these are DRAFT; the Freeze Bar is the next, owner-only step.
