# --- Dependency manifest (contract: recipe-dependency-manifest.v1) ------------
# `schema_version: 2` makes this recipe a self-contained dependency root: both
# `agent:` references below resolve ONLY from the closure declared here, never
# from the calling session's agent map (composition.v1 Core 4, as amended and
# ratified 2026-09-04). Every namespaced agent the recipe names is listed under
# the source that actually ships it; the runner never infers a dependency from a
# namespace prefix (manifest.v1 Core 11), so the self-reference is required.
#
# TWO entries, and why that is collision-free: this repo's ROOT bundle composes
# the lean anchors base, so declaring the lean base beside the root bundle is a
# preflight collision (measured, v1.4.0 changelog). The BEHAVIOR PARTIAL below
# does not compose the lean base, so each helper has exactly one supplier.
#
# PIN HONESTY (measured 2026-09-04): Foundation fetches a `source:` ref with
# `git clone --branch` — a tag or branch resolves, a commit SHA does not.
#   - converge behavior partial: tag `v0.1.0` (immutable; cut 2026-09-04).
#   - anchors base: `@main` — the one remaining branch pin. No foundation tag
#     ships `bundles/anchors` yet (v2.1.2 predates it). Re-pin at the first tag
#     that does; PINS.md carries this as a hard fact.
schema_version: 2

dependencies:
  - source: "git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=bundles/anchors/bundle.md"
    kind: bundle
    required_agents:
      - "anchors:explorer"
  - source: "git+https://github.com/microsoft/amplifier-bundle-converge@v0.1.0#subdirectory=behaviors/converge.yaml"
    kind: behavior
    required_agents:
      - "converge:reconciler"
# -----------------------------------------------------------------------------

name: "seed-reconcile"
description: >
  The Converge ratchet. Reconciles a target repo against its frozen contracts:
  derives/updates a clause-granular conformance ledger, runs the repo's own
  conformance kit, files work-tracker items for every GAP/VIOLATION, records
  bidirectional drift, and emits a reconcile report. Flat, gate-free, and
  schedulable — it never prompts the steward.
version: "1.5.0"
author: "converge bundle"
tags: ["converge", "ratchet", "conformance", "ledger", "reconcile", "drift"]

context:
  # --- required (no default — must be supplied at invocation) ---
  tracker_project: ""      # work-tracker project GAP/VIOLATION items are filed into
  # --- workspace-relative (overridable; default assumes cwd IS the workspace) ---
  target_repo: "./target-repo"       # the repo being reconciled — a subdirectory of cwd
  # --- optional (defaults per mechanism-spec §4.2) ---
  contracts_glob: "contracts/*.md"   # where the seam contracts live
  ledger_dir: "ledger/"              # where rows.yaml and checks/ live (LEDGER-FORMAT §1)
  # --- step budgets, seconds (overridable; defaults are v1.4.1's fixed values) ---
  # A run that says nothing about these behaves exactly as v1.4.1 did. Raise
  # them for a bigger target: LARGE REPOS (≥4 contracts / big ledgers) should
  # set file-drift — and derive-rows, which grows with the same input — to 2700.
  # Measured 2026-09-04: file-drift was cancelled at 900 on a 4-contract target
  # (v1.5.0 changelog). A value that will not resolve, or is not a positive
  # number of seconds, fails before the agent is spawned — never mid-run.
  load_contracts_timeout: 600        # step 1  load-contracts  (read-only intake)
  derive_rows_timeout: 900           # step 2  derive-rows     (raise with contract count)
  run_conformance_timeout: 1200      # step 3  run-conformance (raise with kit size)
  file_drift_timeout: 900            # step 4  file-drift      (raise with ledger size)

steps:
  # ---------------------------------------------------------------------------
  # 1. load-contracts — read-only intake (no mutation)
  # ---------------------------------------------------------------------------
  - id: "load-contracts"
    agent: "anchors:explorer"
    timeout: "{{load_contracts_timeout}}"
    output: "contract_inventory"
    prompt: |
      Read-only intake for a conformance reconcile of the repo at:
        {{target_repo}}

      Do NOT modify anything. Produce a CONTRACT INVENTORY the downstream
      reconciler will derive ledger rows from. Gather:

      1. Every contract file matching `{{contracts_glob}}` (relative to
         {{target_repo}}). For each: its path, and its frozen Core clauses — the
         numbered invariants (e.g. "Core 1", "Core 2", ...). Quote each clause
         VERBATIM (exact bytes). The reconciler anchors rows on these quotes and
         machine-verifies them against contract bytes, so do NOT paraphrase.
      2. Any REQUIRED / EXCLUDED matrix entries present in those contracts.
      3. Current repo-tree evidence relevant to each clause: the files,
         functions, tests, or config that appear to implement, satisfy, or
         contradict it — with concrete paths. This is orientation for
         disposition, NOT a verdict.
      4. The current contents of `{{ledger_dir}}` if it already exists
         (`rows.yaml` and `checks/`), so the reconciler UPDATES rather than
         recreates. If `{{ledger_dir}}` is absent, say so plainly — that means
         this is a first-population SEED run.
      5. The repo's conformance-kit entry point if discoverable (a pytest
         target, a Makefile check, `ledger/checks/`, etc.) — NAME the command;
         do NOT run it (running the kit is a later step).

      Report the inventory as structured prose. Every clause quote must be
      verbatim. If `{{contracts_glob}}` matches no files, say so explicitly — a
      repo with no contracts gets no drift detector, only the demand to write a
      contract. That is a real result to report, not an error to paper over.

  # ---------------------------------------------------------------------------
  # 2. derive-rows — derive/update ledger rows + SYNC row (no kit run yet)
  # ---------------------------------------------------------------------------
  - id: "derive-rows"
    agent: "converge:reconciler"
    timeout: "{{derive_rows_timeout}}"
    output: "derived_rows"
    prompt: |
      SCHEDULED, UNATTENDED reconcile run — you never prompt a human. Any
      decision that would need the steward is left as a ledger row (and, in the
      final step, a tracker item), never surfaced as a question.

      Target repo: {{target_repo}}
      Contracts:   {{contracts_glob}}
      Ledger dir:  {{ledger_dir}}

      WRITE-DENIAL DOCTRINE: If a file write is denied by tool policy, do NOT
      circumvent it (not via bash, not via any other tool). A write denial in an
      ephemeral workspace means the environment is misconfigured — file a blocker
      tracker item naming the denied path, note it in your output, and stop that
      write path honestly.

      Using the contract inventory below, DERIVE or UPDATE the ledger rows per
      LEDGER-FORMAT (your carried knowledge). Do NOT run the conformance kit in
      this step — that is the next step. Here:

      - Emit one row PER CHECKABLE CLAUSE. Derive, never invent: no row without a
        backing clause. Every row quotes its clause verbatim; verify each quote
        against the contract bytes.
      - Assign a PROVISIONAL disposition from the fixed vocabulary
        (CONFORMS / GAP / VIOLATION / OPEN-PINNED / NOT-ASSERTABLE / EXCLUDED;
        DIVERGED only for externally-governed contracts). "Provisional" = before
        the kit runs; the next step confirms it against real results. Attach the
        required fields: a `justification` for every OPEN-PINNED / NOT-ASSERTABLE.
      - Write/refresh the SYNC row (`<PREFIX>-000`) pinning each contract file's
        path + content hash. If a hash differs from the existing ledger, FLAG
        that a mandatory full-ledger re-review is owed — never a silent hash bump
        (LEDGER-FORMAT §4).
      - IDEMPOTENCY: if `{{ledger_dir}}/rows.yaml` already exists, UPDATE rows in
        place matched by their stable `id`. Never renumber, never reuse, never
        duplicate an existing row. New clauses get new ids continuing the
        sequence; a clause that has disappeared is drift, not a deletion.
      - SHAPE (mandatory): `{{ledger_dir}}/rows.yaml` MUST parse as a top-level
        YAML LIST of row mappings — no wrapper mapping, no `meta:` key, nothing
        above the list. The SYNC row (`<PREFIX>-000`) is itself just the first
        row IN that list. Run metadata (repo SHA, timestamps, tallies) belongs in
        the reconcile report ONLY; contract pinning lives in the SYNC row(s). Do
        NOT wrap the rows under `{meta: ..., rows: [...]}` or any other key.
      - SHAPE — clause + quote (mandatory): `contract.clause` MUST be the bare
        numbered identifier exactly as the contract names it ("Core 1", "Core 3")
        — never a paraphrase, never a parenthetical-decorated form like
        "Core 1 (one file, two layers)" (decoration breaks clause joins). And
        `quote` MUST live NESTED under `contract:` (i.e. `contract.quote`), NEVER
        at row top level — a row whose quote is not under `contract:` is malformed
        and silently dodges quote verification.

      Contract inventory:
      {{contract_inventory}}

      Output the derived/updated row set — dispositions, verbatim quotes,
      assertion refs, and the SYNC row — as your result for the next step. Do NOT
      file GAP/VIOLATION tracker items and do NOT write the final rows.yaml yet
      (file-drift does both) — the one exception is a write-denial blocker per the
      doctrine above.

  # ---------------------------------------------------------------------------
  # 3. run-conformance — invoke the repo's OWN kit, map results onto rows
  # ---------------------------------------------------------------------------
  - id: "run-conformance"
    agent: "converge:reconciler"
    timeout: "{{run_conformance_timeout}}"
    output: "conformance_results"
    prompt: |
      SCHEDULED, UNATTENDED reconcile run — no human prompts.

      Target repo: {{target_repo}}

      Run the TARGET REPO'S OWN conformance kit and map its results onto the
      derived rows below. You own NO checks; the repo does. Invoke its existing
      kit via `bash` (e.g. `pytest -q` in {{target_repo}}, or the Makefile /
      check entry point the intake identified). Do NOT reimplement, own, or
      invent checks.

      Rules:
      - A disposition follows the RESULT YOU RAN, never any artifact's claim. A
        `DONE.md`, a health endpoint, a green badge, or a passing-looking log is
        NOT evidence — only the check you executed and observed is (pillar 2).
      - Map each row to its real state from the run: kit-passing backing →
        CONFORMS; a required behavior missing → GAP; a contradicted invariant →
        VIOLATION. A row with no runnable assertion stays NOT-ASSERTABLE (with
        its justification).
      - A NON-ZERO kit exit is DATA, not a failure of this run. Failing checks
        become GAP / VIOLATION dispositions — do NOT treat test failures as an
        error to abort on.
      - If the repo has NO discoverable conformance kit, say so honestly and mark
        the affected rows NOT-ASSERTABLE with that reason. Do NOT fabricate a
        pass.
      - Run the coverage tripwires (LEDGER-FORMAT §6) and report their status.

      Derived rows:
      {{derived_rows}}

      Output, for the final step: each row with its CONFIRMED post-run
      disposition, the exact command(s) you ran and what you observed, and the
      coverage-tripwire results.

  # ---------------------------------------------------------------------------
  # 4. file-drift — write final rows.yaml, file tracker items, write + emit report
  # ---------------------------------------------------------------------------
  - id: "file-drift"
    agent: "converge:reconciler"
    timeout: "{{file_drift_timeout}}"
    output: "final_output"
    prompt: |
      FINAL step of a scheduled, unattended reconcile — no human prompts, ever.
      A finding that needs a steward decision becomes a ledger row + a tracker
      item and is LEFT there. The manager session reads it off the queue and,
      only if it genuinely needs the steward, raises it as one of the four calls
      that reach them: ratify a direction change · an irreversible action · a
      check only a person or device can perform · priority or stop. Your job
      here ends at the row and the item — you never page anyone
      (mechanism-spec §4.2, Finding #4).

      Target repo:     {{target_repo}}
      Ledger dir:      {{ledger_dir}}
      Tracker project: {{tracker_project}}

      WORKSPACE (within-cwd invariant): this recipe is invoked FROM the ephemeral
      workspace root — cwd IS the workspace. Everything you write lands WITHIN
      cwd; {{target_repo}} is a subdirectory of cwd. Writing outside cwd is never
      assumed — it requires explicit user/environment configuration.

      WRITE-DENIAL DOCTRINE: If a file write is denied by tool policy, do NOT
      circumvent it (not via bash, not via any other tool). A write denial in an
      ephemeral workspace means the environment is misconfigured — file a blocker
      tracker item naming the denied path, note it in your output, and stop that
      write path honestly.

      Using the confirmed conformance results below:

      1. WRITE THE FINAL LEDGER to `{{ledger_dir}}/rows.yaml` in {{target_repo}}
         — the full row set with confirmed dispositions, verbatim quotes,
         assertion refs, and the SYNC row. Update in place by stable row id;
         never renumber or duplicate.
         SHAPE (mandatory): the file MUST parse as a top-level YAML LIST of row
         mappings — no wrapper mapping, no `meta:` key, nothing above the list.
         The SYNC row (`<PREFIX>-000`) is just the first row IN the list. Run
         metadata (repo SHA, timestamps, tallies) goes in the reconcile report
         ONLY; contract pinning lives in the SYNC row(s). Do NOT wrap the rows
         under `{meta: ..., rows: [...]}` or any other key.
         SHAPE — clause + quote (mandatory): each row's `contract.clause` MUST be
         the bare numbered identifier exactly as the contract names it ("Core 1",
         "Core 3") — never a paraphrase, never a parenthetical-decorated form like
         "Core 1 (one file, two layers)" (decoration breaks clause joins). And
         `quote` MUST live NESTED under `contract:` (i.e. `contract.quote`), NEVER
         at row top level — a row whose quote is not under `contract:` is
         malformed and silently dodges quote verification. Repair any such row
         before writing.
         After writing, VERIFY the file: it exists, is non-empty, parses as a
         top-level YAML list (not a mapping), AND no row carries a top-level
         `quote` (every quote nested under `contract:`) — a wrapper mapping, a
         hoisted quote, or a missing artifact is a real result, not a silent pass.

      2. RECORD BIDIRECTIONAL DRIFT as rows: movement AWAY from a frozen clause
         is drift; silent movement BACK toward spec ("un-divergence") from a
         pinned behavior is EQUALLY drift. Any change in the
         spec↔implementation relationship not traceable to a ratified amendment
         or a filed work item gets a row (PROTOCOL §3.3).

      3. FILE TRACKER ITEMS for every GAP and VIOLATION row into the work-tracker
         project "{{tracker_project}}", and record the returned item ref back
         onto the row's `work` field. A red row without a live `work` ref is a
         ledger that lies. work-tracker stays authoritative — you file INTO it,
         you never replace it.
         IDEMPOTENCY (this recipe runs repeatedly): BEFORE filing, check the
         tracker for an existing OPEN item already referencing that row id. If
         one exists, do NOT file a duplicate — reference the existing item on the
         row and note it in the report. Only a newly-red row with no open item
         gets a fresh `work_add`. Every filed item's description must carry the
         row id as a back-reference.

      4. PRODUCE THE RECONCILE REPORT containing:
         - rows tallied by disposition (CONFORMS / GAP / VIOLATION / OPEN-PINNED
           / NOT-ASSERTABLE / EXCLUDED / DIVERGED);
         - bidirectional drift found (each direction, or "none");
         - SYNC-row status ("current", or "re-review owed: <which contract hash
           changed>");
         - coverage-tripwire results (pass/fail for each of the three);
         - tracker items filed vs. already-open items referenced.

      5. PERSIST AND EMIT THE REPORT — consumers (an eval harness, future CI)
         grade from a DISK ARTIFACT, not from this session's stream
         (artifacts-not-liveness — the same principle this recipe enforces on the
         repos it audits):
         - WRITE the report to `{{ledger_dir}}/reconcile-report.md` in
           {{target_repo}}. OVERWRITE it on every run — the report reflects the
           LATEST reconcile; history lives in git, not in the file. After
           writing, VERIFY the file exists and is non-empty (a missing artifact
           is a real result, not a silent pass).
         - ALSO emit the same report as your final result (final_output), so an
           in-session caller sees it too.
         Then STOP honestly — if something could not be asserted or run, name it
         as a real residual rather than reporting a clean run that did nothing.

      Confirmed conformance results:
      {{conformance_results}}
