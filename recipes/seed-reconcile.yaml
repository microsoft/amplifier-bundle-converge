# =============================================================================
# seed-reconcile — the Converge "ratchet"
# =============================================================================
#
# Reconciles a target repo against its FROZEN contracts. Derives/updates a
# clause-granular conformance ledger, runs the repo's OWN conformance kit, maps
# results onto rows, files work-tracker items for every GAP/VIOLATION, records
# bidirectional drift, and emits a reconcile report (both as the recipe's final
# output AND as a disk artifact at {{ledger_dir}}/reconcile-report.md).
#
# Mechanism spec: @converge:docs/design/mechanism-spec.md §4.2
# Ledger format:  @converge:docs/LEDGER-FORMAT.md
# Protocol:       @converge:docs/PROTOCOL.md §3.3 (drift + disposition semantics)
#
# SCHEDULABLE / UNATTENDED — this loop NEVER prompts a human. It has zero
# approval gates and zero steward-facing moments (mechanism-spec §4.2
# owner_interaction, Finding #4). A finding that would need a steward decision
# is filed as a ledger row + tracker item and LEFT there. The manager session
# reads it off the queue and, only if it genuinely needs the steward, raises it
# as one of the four calls that reach them — ratify a direction change ·
# an irreversible action · a check only a person or device can perform ·
# priority or stop (operation.v1 Core 11). Nothing here pages a human.
#
# IDEMPOTENT-ish — designed to run repeatedly (every merge + on schedule):
#   - ledger rows are UPDATED in place by stable id, never renumbered/duplicated;
#   - tracker filing checks for an existing OPEN item per row id and references
#     it rather than blind-duplicating.
#
# WORKSPACE (within-cwd invariant) — the recipe is invoked FROM the ephemeral
# workspace root: cwd IS the workspace. Everything this recipe writes lands
# within cwd; the target repo is a subdirectory of cwd (`target_repo` defaults to
# `./target-repo`, overridable). Writing outside cwd is never assumed — it
# requires explicit user/environment configuration.
#
# Requirements:
#   - the lean anchors base (provides `anchors:explorer`, recipes runtime).
#     A recipe can only reach helpers present in the session it runs in, so run
#     this from a Converge session or a host on the same lean base.
#   - converge bundle  (provides `converge:reconciler` — the one mutating agent,
#     carries LEDGER-FORMAT.md; has read/glob/grep/bash/write_file/git + the
#     work-tracker tools it files GAP/VIOLATION items with)
#   - a reachable work-tracker service + the named `tracker_project`
#
# Usage (in session): "run seed-reconcile filing gaps into <project>"
# Usage (CLI): invoke FROM the workspace root (cwd IS the workspace). target_repo
# defaults to ./target-repo, so only tracker_project is required:
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@converge:recipes/seed-reconcile.yaml \
#     context='{"tracker_project": "drumbeat-conformance"}'
#   # override target_repo only for a repo elsewhere WITHIN cwd, e.g.
#   #   context='{"tracker_project": "...", "target_repo": "./sub/drumbeat"}'
#
# Outputs (all in the target repo; consumers grade from the disk artifacts, not
# from the in-session stream — artifacts-not-liveness):
#   - {{ledger_dir}}/rows.yaml            updated ledger rows (confirmed
#                                         dispositions + required fields + SYNC row)
#   - work-tracker items                  one per GAP/VIOLATION row, with the row
#                                         id as the back-reference
#   - {{ledger_dir}}/reconcile-report.md  the reconcile report as a disk artifact
#                                         (overwritten each run; history in git)
#   - final_output                        the same reconcile report, in-session
#
# Context variables:
#   - tracker_project (required) work-tracker project for GAP/VIOLATION items
#   - target_repo     (optional) default "./target-repo" — a subdirectory of cwd
#   - contracts_glob  (optional) default "contracts/*.md"
#   - ledger_dir      (optional) default "ledger/"
#   - load_contracts_timeout  (optional) default 600  — seconds, step 1
#   - derive_rows_timeout     (optional) default 900  — seconds, step 2
#   - run_conformance_timeout (optional) default 1200 — seconds, step 3
#   - file_drift_timeout      (optional) default 900  — seconds, step 4
#     SIZE GUIDANCE: large repos (≥4 contracts / big ledgers): set file-drift
#     (and derive-rows) to 2700. The defaults are sized for a small target and
#     are what a run gets if it says nothing.
# =============================================================================
#
