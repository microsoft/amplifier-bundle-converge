# =============================================================================
# full-wave — Converge the owner-gated wave (PROTOCOL.md §4, the whole loop)
# =============================================================================
#
# The capstone recipe: composes SEED/RECONCILE → QUEUE → EXECUTE → MERGE →
# VERIFY → CLOSE with approval gates at EXACTLY the four §6 owner-attention
# points and nowhere else. Anything else reaching the owner is a protocol defect.
#
# Mechanism spec: @converge:docs/design/mechanism-spec.md §4.3 (authoritative)
# Protocol:       @converge:docs/PROTOCOL.md §4 (the loop), §5 (Freeze Bar —
#                 owner-only), §6 (the four-item owner attention budget)
# Composes:       ./seed-reconcile.yaml (S0, flat, context-isolated sub-recipe)
#
# STAGED / INTERACTIVE / OWNER-GATED · NOT schedulable (four owner gates).
#
# -----------------------------------------------------------------------------
# ENGINE SEMANTICS — read first (the encode v1.0.0→v1.1.0 hard-won lesson):
#   1. A stage's `approval:` gate fires AFTER that stage's steps complete; it
#      gates the transition to the NEXT stage. So a gate is DECLARED on the PRIOR
#      stage, and every step that ACTS on the owner's answer lives in the NEXT
#      stage. Gate-on-prior, consumers-in-next — the engine's own passing
#      approval-fixture shape. (encode inverted this once; never again.)
#   2. `{{_approval_message}}` holds ONLY the most-recent gate's message. This
#      wave has FOUR gates, so each consuming stage MUST persist its record to
#      `{{wave_dir}}/<gate>.approval` (a bash step) the moment it is consumed —
#      four gates, four persisted records, the wave's owner-decision AUDIT TRAIL.
#      A later stage's `{{_approval_message}}` will have been overwritten.
#   3. FAIL LOUD on empty approvals. Every gate-consuming stage's FIRST step is a
#      bash assert: empty/whitespace record → exit 1, HALT the wave. An empty or
#      auto-approved record is an AUTHORIZATION FAILURE, never an input gap. (In
#      this recipe assert + persist are the same first bash step per stage.)
#
# -----------------------------------------------------------------------------
# STAGE / GATE MAP (post-stage semantics; four gates 1:1 with §6, no fifth):
#
#   Stage            Steps (executor)                    Declares gate (fires after)
#   ---------------  ----------------------------------  ---------------------------
#   S0  seed         invoke ./seed-reconcile.yaml         —
#                    (sub-recipe: flat, context-isolated)
#   S1  queue        converge:reconciler → candidate      priority-kill      (§6 #4)
#                    queue (lane-brief discipline)
#   S2  execute      consume priority-kill → foreach over  irreversible-ops   (§6 #2)
#                    owner-authorized items (executor)
#   S3  merge        consume irreversible-ops →            —
#                    foundation:git-ops merges to main
#   S4  verify       converge:reconciler re-runs ledger    human-device-verify(§6 #3)
#                    post-merge (artifact-checked)
#   S4b ratify-review consume human-device-verify →        ratify-changes     (§6 #1)
#                    summarize for the ratify prompt
#   S5  close        consume ratify-changes →              —
#                    converge:reconciler freeze-bar report
#
#   Gate               DECLARED on   FIRES before   CONSUMED by   semantic
#   -----------------  -----------   ------------   -----------   -----------------
#   priority-kill      S1 queue      S2 execute     S2 execute    authorizes_next (§6#4)
#   irreversible-ops   S2 execute    S3 merge       S3 merge      authorizes_next (§6#2)
#   human-device-verify S4 verify    S4b review     S4b review    validates_previous (§6#3)
#   ratify-changes     S4b review    S5 close       S5 close      validates_previous (§6#1)
#
#   WHY S4b EXISTS: human-device-verify and ratify-changes are BOTH
#   validates_previous and both sit late. This engine carries one gate per stage
#   boundary, so the two must occupy DISTINCT boundaries: human-device-verify on
#   S4→S4b, ratify-changes on S4b→S5. S4b is a short review stage that makes the
#   second late boundary exist. It is a real (non-empty) stage — a zero-step
#   stage is not relied upon; S4b carries its assert+persist step plus one cheap
#   summarize step. Net stages S0,S1,S2,S3,S4,S4b,S5 — still exactly FOUR gates.
#   (Reconciliation note: spec §4.3's stage table reads as if S3 declares
#   human-device-verify; its ordering note — the explicit post-stage resolution
#   that makes S4b necessary — places it on S4. This recipe follows the ordering
#   note, the only reading under which S4b is not redundant.)
#
# -----------------------------------------------------------------------------
# EXECUTOR (S2) — the honest v1 scope (owner-decided; do not re-open):
#   A `foreach` over the owner-authorized queued items, bounded parallelism, each
#   item handled by a work-capable agent step: work_claim the tracker item → a
#   bounded change WITHIN cwd → DONE.md + commit → work_resolve. This is real,
#   in-engine, testable fan-out.
#   RESIDUAL (named, never hidden — S5 reports it): true autonomous lane custody
#   (per-lane worktree/tmux leases, cross-session reclaim, liveness independent
#   of the wave) is OUT OF SCOPE for the recipe engine and DEFERRED to an
#   external orchestrator (ten-lane-highway / goal-batch) invoked outside this
#   recipe. `full-wave` v1 executes items in bounded in-session foreach batches.
#   The `lane-brief` skill still governs briefing + completion-by-artifact.
#
# -----------------------------------------------------------------------------
# HARD CONSTRAINTS (mechanism-spec §4.3 — zero latitude):
#   - WITHIN-CWD (v1.2.0): every write, merge, and commit resolves inside cwd /
#     {{target_repo}}; {{wave_dir}} is inside cwd. Nothing outside the workspace.
#   - WRITE-DENIAL / candidate-guard (increment 2): the hook is ON. The wave
#     writes ledger rows, tracker items, lane code, DONE.md, reports — none are
#     FROZEN contract/VISION.md files, so none are guard-denied. The wave NEVER
#     writes a FROZEN file directly and NEVER stamps FROZEN itself (owner-only,
#     §5); any vision/contract change rides the CANDIDATE flow and lands only via
#     the owner's ratify-changes word (S5 records that word, it does not stamp).
#   - TRACKER via work_* tools: items claimed/filed/resolved through work-tracker
#     (work_claim / work_add / work_file / work_resolve); the wave files INTO the
#     tracker, never replaces it (§C).
#   - DERIVE NOTHING NEW: work is drawn from the ledger/tracker gap S0 produced,
#     never invented (§C; pillar 5).
#
# Inputs (recipe context):
#   - target_repo    (optional) default "." — the repo the wave runs on (cwd or
#     within cwd). Passed through to the seed-reconcile sub-recipe (overriding
#     its own "./target-repo" default).
#   - tracker_project(required) — work-tracker project for queued/executed items;
#     passed through to seed-reconcile.
#   - contracts_glob (optional) default "contracts/*.md" — passed to seed-reconcile.
#   - ledger_dir     (optional) default "ledger/" — passed to seed-reconcile.
#   - wave_dir       (optional) default ".converge/wave/" — where the four gate
#     records persist (the owner-decision audit trail). Inside cwd.
#   - authorized_items (optional) default "" — normally runtime-derived from the
#     priority-kill gate message; may be pre-set as an explicit override (e.g. a
#     non-interactive test). The S2 parse step honors it when non-empty.
#   - execute_parallel (optional) default 2 — bounded foreach concurrency for S2.
#
# Outputs:
#   - refreshed ledger + filed tracker items (S0) · lane commits + DONE.md per
#     executed item (S2) · merged main (S3) · post-merge verify report (S4) ·
#     freeze-bar report with honestly-named residuals incl. deferred lane custody
#     (S5) · four persisted gate records under {{wave_dir}} (the audit trail).
#
# Usage: invoke FROM the workspace root (cwd IS the workspace). The wave pauses
# at each of the four gates; approve each with the owner's literal word (item
# authorizations at priority-kill; the ratifying word at ratify-changes):
#   amplifier tool invoke recipes operation=execute \
#     recipe_path=@converge:recipes/full-wave.yaml \
#     context='{"tracker_project": "drumbeat-conformance"}'
# =============================================================================
#
# CHANGELOG
# -----------------------------------------------------------------------------
# v1.0.0 (2026-08-30):
#   - NEW FEATURE: Initial full-wave recipe (Converge the owner-gated wave).
#     * Staged: S0 seed (sub-recipe) → S1 queue → S2 execute → S3 merge →
#       S4 verify → S4b ratify-review → S5 close; exactly four §6 gates.
#     * Post-stage gate semantics throughout (gate-on-prior, consumers-in-next),
#       per the encode v1.1.0 lesson.
#     * Four persisted gate records under wave_dir (audit trail); every
#       gate-consuming stage opens with a fail-loud assert+persist bash step.
#     * S4b resolves the two-late-validates_previous-gates boundary problem with
#       a real (non-empty) review stage.
#     * Executor = bounded foreach over owner-authorized items (honest v1); true
#       lane custody DEFERRED and named as an S5 residual.
#     * Honors within-cwd, write-denial/candidate-guard (never stamps FROZEN),
#       work_* tracker filing, and derive-nothing-new.
# =============================================================================

name: "full-wave"
description: >
  The Converge owner-gated wave. Composes the whole loop — SEED/RECONCILE →
  QUEUE → EXECUTE → MERGE → VERIFY → CLOSE — with approval gates at exactly the
  four §6 owner-attention points and nowhere else. Seeds via the seed-reconcile
  sub-recipe, queues real work from the ledger gap, executes owner-authorized
  items as bounded foreach fan-out, merges, re-verifies post-merge, and closes
  with a freeze-bar report. Never stamps FROZEN; invents no work.
version: "1.0.0"
author: "converge bundle"
tags: ["converge", "full-wave", "loop", "queue", "execute", "merge", "verify", "close", "staged"]

# Sub-recipe composition (S0 invokes seed-reconcile) → allow one level of depth.
recursion:
  max_depth: 3
  max_total_steps: 300

context:
  # --- required (no default — must be supplied at invocation) ---
  tracker_project: ""            # work-tracker project for queued/executed items
  # --- workspace-relative (overridable; default assumes cwd IS the workspace) ---
  target_repo: "."               # the repo the wave runs on — cwd or within cwd
  wave_dir: ".converge/wave/"    # where the four gate records persist (inside cwd)
  # --- optional (passed through to the seed-reconcile sub-recipe) ---
  contracts_glob: "contracts/*.md"
  ledger_dir: "ledger/"
  # --- execution tuning ---
  execute_parallel: 2            # bounded foreach concurrency for S2 execute
  # --- normally runtime-derived; may be pre-set as an explicit override ---
  authorized_items: ""           # owner-authorized item ids (else parsed from the gate)
  # --- runtime-injected by the gates (declared so static validation resolves it;
  #     each gate OVERWRITES this with its own message; consuming stages persist
  #     it immediately — see ENGINE SEMANTICS #2) ---
  _approval_message: ""          # most-recent gate's message, set by the engine

stages:
  # ===========================================================================
  # S0 seed — populate/refresh the ledger via the seed-reconcile sub-recipe.
  #   Flat, gateless, CONTEXT-ISOLATED: the sub-recipe sees only the context we
  #   pass here, nothing else from this wave. Declares no gate.
  # ===========================================================================
  - name: "seed"
    steps:
      - id: "seed-reconcile"
        type: "recipe"
        recipe: "./seed-reconcile.yaml"
        timeout: 3600
        output: "seed_result"
        context:
          target_repo: "{{target_repo}}"
          contracts_glob: "{{contracts_glob}}"
          ledger_dir: "{{ledger_dir}}"
          tracker_project: "{{tracker_project}}"

  # ===========================================================================
  # S1 queue — turn READY ledger rows into a candidate queue for the owner.
  #   DECLARES priority-kill (fires after S1, gating entry to S2 execute).
  # ===========================================================================
  - name: "queue"
    approval:
      required: true            # hardcoded — the owner picks/kills; no bypass
      timeout: 0                # wait indefinitely for the owner
      default: "deny"           # absent an owner word, nothing is authorized
      prompt: |
        PRIORITY-KILL — owner picks which queued items are AUTHORIZED to run this
        wave, and which are KILLED (owner attention budget §6, item #4). No work
        runs until you answer. This is the only place work is authorized.

        Candidate queue (derived from the ledger gap — real work, not invented):
        {{candidate_queue}}

        Answer naming the items to authorize (and, optionally, any to kill), by
        their ids — e.g. "authorize LGR-003, LGR-007; kill LGR-011". Authorizing
        nothing is a valid answer: the wave will merge/verify/close with zero
        executed items and say so honestly.

        Your message is persisted as the priority-kill record and parsed for the
        authorized item ids.
    steps:
      - id: "build-candidate-queue"
        agent: "converge:reconciler"
        timeout: 1200
        output: "candidate_queue"
        prompt: |
          Build the candidate QUEUE for this wave from the current ledger/tracker
          in {{target_repo}} (ledger dir {{ledger_dir}}). The seed/reconcile pass
          just ran; its result:
          {{seed_result}}

          Turn the READY rows (GAP/VIOLATION rows that carry a filed work item)
          into a candidate queue of tracker items, each with CLAUSE-QUOTING
          acceptance criteria (quote the backing contract clause verbatim) and
          the lane-brief discipline applied: an honesty gate (what "not proven"
          looks like, named before work starts) and, where two items touch the
          same repo, an explicit file-ownership split.

          DERIVE NOTHING NEW (pillar 5): every candidate item traces to a ledger
          row that traces to a contract clause. Invent no item no row backs. If
          there is no ready work, say so plainly — an empty queue is a real
          result the owner will see at the gate.

          Output the candidate queue as a readable list — for EACH item: its
          tracker id, a one-line title, the quoted acceptance clause, and the
          honesty-gate note. This list is shown to the owner at the priority-kill
          gate; keep the ids stable and unambiguous so the owner can name them.

  # ===========================================================================
  # S2 execute — work ONLY the owner-authorized items (bounded foreach).
  #   CONSUMES priority-kill (assert+persist FIRST, then parse authorized ids).
  #   DECLARES irreversible-ops (fires after S2, gating entry to S3 merge).
  # ===========================================================================
  - name: "execute"
    approval:
      required: true            # hardcoded — owner authorizes the irreversible merge
      timeout: 0
      default: "deny"
      prompt: |
        IRREVERSIBLE-OPS — owner authorizes the irreversible MERGE of the
        completed, authorized lanes to main (owner attention budget §6, item #2).
        Nothing is merged until you answer.

        Items executed this wave (lane commits + DONE.md per item):
        {{executed_items}}

        Answer to authorize the merge (e.g. "authorized: merge") or decline
        (e.g. "declined: <reason>") — a decline stops the wave before any merge.
        Your message is persisted as the irreversible-ops record.
    steps:
      - id: "assert-persist-priority-kill"
        type: "bash"
        on_error: "fail"
        output: "priority_kill_record"
        command: |
          set -euo pipefail
          mkdir -p "{{wave_dir}}"
          # Capture the gate message via a quoted heredoc so arbitrary quotes /
          # newlines in the owner's word cannot break the shell.
          record=$(cat <<'CONVERGE_GATE_EOF'
          {{_approval_message}}
          CONVERGE_GATE_EOF
          )
          if [ -z "$(printf '%s' "$record" | tr -d '[:space:]')" ]; then
            echo "FATAL: empty priority-kill approval record — the gate was bypassed or the engine changed; halting the wave. An empty record is an authorization failure, not an input gap." >&2
            exit 1
          fi
          printf '%s' "$record" > "{{wave_dir}}/priority-kill.approval"
          echo "priority-kill record persisted to {{wave_dir}}/priority-kill.approval"

      - id: "parse-authorized-items"
        agent: "foundation:file-ops"
        timeout: 300
        output: "authorized"
        parse_json: true
        prompt: |
          Determine which candidate items the owner AUTHORIZED for this wave.

          Primary source — the persisted priority-kill record (the owner's
          literal word):
          {{priority_kill_record}}

          Explicit override (use ONLY if non-empty; otherwise ignore):
          {{authorized_items}}

          Candidate queue the owner was choosing from (authorize ONLY ids that
          appear here — never invent an id the queue does not list):
          {{candidate_queue}}

          Extract the authorized ids (and any explicitly killed). If the owner
          authorized nothing, return an empty item_ids list — that is a valid,
          honest result, not an error.

          Return ONLY this JSON:
          {
            "item_ids": [ { "id": "<tracker id>", "title": "<one line>" } ],
            "killed":   [ "<tracker id>" ],
            "notes": "<how you read the owner's word>"
          }

      - id: "execute-items"
        foreach: "{{authorized.item_ids}}"
        as: "item"
        parallel: "{{execute_parallel}}"
        agent: "foundation:modular-builder"
        timeout: 1800
        output: "item_result"
        collect: "executed_items"
        prompt: |
          Work EXACTLY ONE authorized queued item, end to end, honestly.

          Item: {{item.id}} — {{item.title}}

          Do, in order:
          1. work_claim {{item.id}} — take custody of the tracker item and read
             its clause-quoting acceptance criteria (your spec for "done").
          2. Make the BOUNDED change that satisfies that acceptance, entirely
             WITHIN cwd / {{target_repo}}. Touch only what this item owns (respect
             the lane-brief file-ownership split). Do NOT write FROZEN
             contract/VISION.md files — those ride the CANDIDATE flow, not a lane;
             if the change would require one, stop and record it as blocked.
          3. Write a DONE.md for this item stating what was done and — per the
             honesty gate — what is NOT proven, then COMMIT the change + DONE.md
             (a commit is the only durable evidence; a self-report is never proof,
             pillar 2).
          4. work_resolve {{item.id}} with a short user-facing reason, OR, if you
             could not honestly finish, leave it unresolved and write a
             BLOCKED.md naming the cause (a missing artifact is a real result,
             pillar 5 — never fabricate completion).

          WRITE-DENIAL DOCTRINE: if a write is denied by tool policy, do NOT
          circumvent it (not via bash, not any other tool) — record the denied
          path and stop that path honestly; a denial in an ephemeral workspace
          means misconfiguration or a FROZEN-path collision.

          Output a short result for this item: {{item.id}}, the commit SHA (or
          "no commit"), resolved vs blocked, and the honest not-proven note.

  # ===========================================================================
  # S3 merge — merge the authorized, completed lanes to main.
  #   CONSUMES irreversible-ops (assert+persist FIRST, then merge).
  #   Declares NO gate (S3→S4 is gateless: no owner decision merge→verify).
  # ===========================================================================
  - name: "merge"
    steps:
      - id: "assert-persist-irreversible-ops"
        type: "bash"
        on_error: "fail"
        output: "irreversible_ops_record"
        command: |
          set -euo pipefail
          mkdir -p "{{wave_dir}}"
          record=$(cat <<'CONVERGE_GATE_EOF'
          {{_approval_message}}
          CONVERGE_GATE_EOF
          )
          if [ -z "$(printf '%s' "$record" | tr -d '[:space:]')" ]; then
            echo "FATAL: empty irreversible-ops approval record — the gate was bypassed or the engine changed; halting the wave before any merge. An empty record is an authorization failure, not an input gap." >&2
            exit 1
          fi
          printf '%s' "$record" > "{{wave_dir}}/irreversible-ops.approval"
          echo "irreversible-ops record persisted to {{wave_dir}}/irreversible-ops.approval"

      - id: "merge-lanes"
        agent: "foundation:git-ops"
        timeout: 900
        output: "merge_result"
        prompt: |
          Merge the authorized, COMPLETED lanes to main in {{target_repo}}. The
          owner has authorized this irreversible operation; the record:
          {{irreversible_ops_record}}

          WITHIN-CWD: operate only on the repo at {{target_repo}} (inside cwd).
          Merge ONLY the commits produced by the executed items below — each item
          that resolved with a real commit. Do NOT merge blocked/unresolved items
          or sweep in unrelated working-tree changes. Completion is judged from
          git artifacts (commits, DONE.md), NEVER from a self-report or pane
          liveness; check provenance (an inherited-from-fork commit is the #1
          false signal) before crediting a lane.

          Executed items (with their commit SHAs / blocked status):
          {{executed_items}}

          Output the merge result: which item commits merged to main (with the
          resulting main SHA), which were skipped and why. If nothing merged
          (zero authorized/completed), say so plainly — an empty merge is honest.

  # ===========================================================================
  # S4 verify — re-run the ledger post-merge; promote each verdict only by its
  #   own artifact check. Declares NO consume (S3→S4 gateless).
  #   DECLARES human-device-verify (fires after S4, gating entry to S4b).
  # ===========================================================================
  - name: "verify"
    approval:
      required: true            # hardcoded — human/device confirmation, no bypass
      timeout: 0
      default: "deny"
      prompt: |
        HUMAN-DEVICE-VERIFY — the post-merge verification only a human or a device
        can perform / confirm (owner attention budget §6, item #3). The automated
        ledger re-run is below; confirm what a machine check cannot.

        Post-merge verify report:
        {{verify_report}}

        Answer confirming the human/device verification (e.g. "verified: <what
        you checked on the device>") or reporting a failure (e.g. "failed:
        <what>"). Your message is persisted as the human-device-verify record.
    steps:
      - id: "reverify-post-merge"
        agent: "converge:reconciler"
        timeout: 1800
        output: "verify_report"
        prompt: |
          Re-run the conformance ledger on {{target_repo}} POST-MERGE and report
          drift, exactly as a standing reconcile would. The merge that just
          landed:
          {{merge_result}}

          Promote EACH verdict only by its OWN artifact check (pillar 2): run the
          repo's own conformance kit and read the result; a DONE.md, a health
          endpoint, or a green-looking log is not evidence. Apply lane-brief
          provenance discipline — an inherited-from-fork artifact is the #1 false
          signal; check commit/mtime before crediting any verdict to this wave.
          Detect drift in BOTH directions (away from spec AND silent movement
          back). File GAP/VIOLATION tracker items for any new red rows.

          Output the VERIFY REPORT: rows by disposition, any new drift (each
          direction), the post-merge SYNC status, coverage-tripwire results, and
          any verdict you could NOT promote by artifact (named honestly). This
          report is shown to the owner at the human-device-verify gate.

  # ===========================================================================
  # S4b ratify-review — the second late boundary (see WHY S4b EXISTS, header).
  #   CONSUMES human-device-verify (assert+persist FIRST).
  #   A short, real review stage: persist the record, then summarize for the
  #   ratify prompt. DECLARES ratify-changes (fires after S4b, gating entry to S5).
  # ===========================================================================
  - name: "ratify-review"
    approval:
      required: true            # hardcoded — owner ratifies in the literal word; no bypass
      timeout: 0
      default: "deny"
      prompt: |
        RATIFY-CHANGES — owner ratifies any vision/contract change or FROZEN stamp
        this wave surfaced (owner attention budget §6, item #1). This is a
        literal-word act; no one but you ratifies.

        Verification confirmed by the prior gate, and the review summary:
        {{ratify_review_summary}}

        Answer with the literal word:
          - "ratified"            — accept the wave's outcome as-is;
          - "ratified as edited: <edits>" — accept with the named changes;
          - "declined: <reason>"  — deny; the wave stops before close records it.

        Ratifying does NOT stamp FROZEN — the Freeze Bar (§5) is a later,
        owner-only act. Your message is persisted as the ratify-changes record
        and recorded verbatim in the close report.
    steps:
      - id: "assert-persist-human-device-verify"
        type: "bash"
        on_error: "fail"
        output: "human_device_verify_record"
        command: |
          set -euo pipefail
          mkdir -p "{{wave_dir}}"
          record=$(cat <<'CONVERGE_GATE_EOF'
          {{_approval_message}}
          CONVERGE_GATE_EOF
          )
          if [ -z "$(printf '%s' "$record" | tr -d '[:space:]')" ]; then
            echo "FATAL: empty human-device-verify approval record — the gate was bypassed or the engine changed; halting the wave. An empty record is an authorization failure, not an input gap." >&2
            exit 1
          fi
          printf '%s' "$record" > "{{wave_dir}}/human-device-verify.approval"
          echo "human-device-verify record persisted to {{wave_dir}}/human-device-verify.approval"

      - id: "summarize-for-ratify"
        type: "bash"
        on_error: "fail"
        output: "ratify_review_summary"
        command: |
          set -euo pipefail
          # Cheap, deterministic review summary for the ratify-changes gate prompt.
          # (This is the one real step that makes S4b a non-empty stage so the
          # second late validates_previous gate has its own clean boundary.)
          hdv=$(cat <<'CONVERGE_HDV_EOF'
          {{human_device_verify_record}}
          CONVERGE_HDV_EOF
          )
          report=$(cat <<'CONVERGE_VR_EOF'
          {{verify_report}}
          CONVERGE_VR_EOF
          )
          {
            echo "=== RATIFY-REVIEW SUMMARY ==="
            echo
            echo "-- Human/device verification (confirmed at the prior gate) --"
            printf '%s\n' "$hdv"
            echo
            echo "-- Post-merge verify report --"
            printf '%s\n' "$report"
            echo
            echo "Persisted gate records so far: {{wave_dir}}/priority-kill.approval, "
            echo "{{wave_dir}}/irreversible-ops.approval, {{wave_dir}}/human-device-verify.approval"
          }

  # ===========================================================================
  # S5 close — record the owner's ratification, emit the freeze-bar report.
  #   CONSUMES ratify-changes (assert+persist FIRST). Declares NO gate (terminal).
  #   NEVER stamps FROZEN — records the owner's literal word only.
  # ===========================================================================
  - name: "close"
    steps:
      - id: "assert-persist-ratify-changes"
        type: "bash"
        on_error: "fail"
        output: "ratify_changes_record"
        command: |
          set -euo pipefail
          mkdir -p "{{wave_dir}}"
          record=$(cat <<'CONVERGE_GATE_EOF'
          {{_approval_message}}
          CONVERGE_GATE_EOF
          )
          if [ -z "$(printf '%s' "$record" | tr -d '[:space:]')" ]; then
            echo "FATAL: empty ratify-changes approval record — the gate was bypassed or the engine changed; halting before close records anything. An empty ratification is an authorization failure, not an input gap." >&2
            exit 1
          fi
          printf '%s' "$record" > "{{wave_dir}}/ratify-changes.approval"
          echo "ratify-changes record persisted to {{wave_dir}}/ratify-changes.approval"

      - id: "close-freeze-bar-report"
        agent: "converge:reconciler"
        timeout: 900
        output: "final_output"
        prompt: |
          Close the wave: emit the FREEZE-BAR REPORT for {{target_repo}}, naming
          residuals honestly (§5 / pillar 5). Record the owner's ratification;
          do NOT stamp FROZEN — that is an owner-only Freeze Bar act. If the
          owner's ratify word stamped any DRAFT→FROZEN or ratified an amendment,
          RECORD that literal word as the provenance; you still do not apply the
          stamp yourself.

          Owner ratification (verbatim — record it in the report):
          {{ratify_changes_record}}

          Wave inputs to summarize:
          - Seed/reconcile result: {{seed_result}}
          - Items executed:        {{executed_items}}
          - Merge result:          {{merge_result}}
          - Post-merge verify:     {{verify_report}}

          The FREEZE-BAR REPORT must state, plainly:
          - what merged and what remains open (drawn from the ledger, not memory);
          - for any contract eyeing FROZEN: which of the four Freeze Bar
            conditions (§5) are met and which are NOT — recommend, never stamp;
          - the four persisted gate records under {{wave_dir}} as the wave's
            owner-decision audit trail (priority-kill, irreversible-ops,
            human-device-verify, ratify-changes);
          - the NAMED RESIDUAL (owner-decided scope): true parallel worktree lane
            custody is DEFERRED to an external orchestrator (ten-lane-highway /
            goal-batch); this wave executed items via bounded in-session foreach,
            not durable multi-session lane custody. State it as a residual, not a
            silent omission.
          - any item left blocked/unresolved, with its cause (a missing artifact
            is a real result — never report a clean wave that did nothing).

          Emit the freeze-bar report as your final result.
