[project]
name = "fixture-hooks-candidate-guard-sample-bad"
version = "0.1.0"
description = "Fixture stand-in for hooks-candidate-guard, so this miniature repository can actually be stood up as a session."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-candidate-guard = "amplifier_module_hooks_candidate_guard:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_candidate_guard"]
