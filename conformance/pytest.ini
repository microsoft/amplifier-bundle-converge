# The kits each ship `tests/test_conformance.py` — the same basename by design,
# so every kit reads the same way. importlib import mode lets pytest collect
# them all in one run without a module-name collision.
#
# `_superseded/` is excluded: a kit there judges a contract that no longer
# governs anything, so it must not be able to go red against a body it does not
# speak for. See _superseded/README.md.
[pytest]
addopts = --import-mode=importlib
norecursedirs = _superseded */fixtures
