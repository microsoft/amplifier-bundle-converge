# =============================================================================
# answer-key/scenario-3.yaml -- lying-artifact
# =============================================================================
#
# Ground truth for grading a reconcile pass against
# fixtures/setup_scenario.sh 3 output: a single-branch clone carrying a real
# regression PLUS a confident, false DONE.md claiming full green.
#
# Commit shas are informational only (not pinned across re-runs -- see the
# note in scenario-2.yaml). Observed during this fixture's own verification:
#   base    175b3bf749ab5ec1a26f5efede23e329d70d999f  (= drumbeat HEAD)
#   main    f89cb285d6817b83ba0f4c0336f8b6686d96cb93  "fix(automation): don't flag a single numbered aside as body-steps"  (commit 3a)
#   main    008272501c3bb2684d489da7c3a0c9ffc01adf4c  "docs: lane complete -- automation contract cleanup done"           (commit 3b)
#
# Schema note: `scenario`, `contracts` (with each contract's `clauses` list
# of `{id, quote, ...}`), `broken_kit`, and `false_claim` below satisfy the
# answer-key interface `graders/programmatic.py`'s `load_answer_key()`/
# `check_coverage()`/`check_broken_kit_not_conforms()`/
# `check_false_claim_not_evidence()` require -- that is the schema actually
# consumed by automated grading. `contracts` is the same 12-clause set
# documented in full narrative detail in `scenario-1.yaml`.
# =============================================================================

scenario: 3

contracts:
  - file: contracts/automation-file.v1.md
    clauses:
      - id: "Core 1"
        quote: |-
          1. **One file, two layers.** An automation is a single markdown file: YAML
             frontmatter (the machine surface) and an optional markdown body (human-facing
             description). **The body is never parsed for execution.**
        expected_disposition: CONFORMS
      - id: "Core 2"
        quote: |-
          2. **Closed frontmatter vocabulary.** Every top-level frontmatter key is
             registered (the registry lives in `docs/AUTOMATIONS.md` §2). An unknown or
             retired key is **refused loudly with a remedy** at validation time — never
             ignored, never warned-and-continued.
        expected_disposition: CONFORMS
      - id: "Core 3"
        quote: |-
          3. **Steps are structured data.** `steps:` is a required, ordered list in the
             frontmatter. Each step is an object with exactly these keys:
             - `id` (required) — a slug, unique within the file
             - `prompt` (required) — non-empty text; the entirety of the step's behavior
             - `label` (optional) — human display name
             An unknown key inside a step object is refused the same way as an unknown
             top-level key.
        expected_disposition: CONFORMS
      - id: "Core 4"
        quote: |-
          4. **Execution semantics.** Steps execute in array order, one agent turn per
             step, all within the automation's (lifecycle-governed) session. Step `id`
             appears in run records; it is identity, not control flow.
        expected_disposition: CONFORMS
      - id: "Core 5"
        quote: |-
          5. **Steps carry zero configuration.** Scheduling, notification policy,
             conversation lifecycle, agent config/profile selection, and activity labels
             are top-level frontmatter concerns that apply to the whole automation. A step
             is judgment (prompt) plus identity (id) — nothing operational.
        expected_disposition: CONFORMS
      - id: "Core 6"
        quote: |-
          6. **Fail loud with remedy.** Any violation of 1–5 makes the automation invalid:
             save is rejected and the scheduler refuses the file, in both cases naming the
             offending key/step and the remedy. No silent degraded modes.
        expected_disposition: CONFORMS
  - file: contracts/drumpack-card.v1.md
    clauses:
      - id: "Core 1"
        quote: |-
          1. **One directory, one card.** A drumpack is a directory containing exactly one
             `drumpack.md` at its root: YAML frontmatter (machine surface) + markdown body
             (agent-facing manual). The body is documentation for the agent; the engine
             never parses it for behavior — but it **must be non-empty** (loader-enforced):
             a card that says nothing puts a tool on PATH with no knowledge attached, the
             one thing the card exists to prevent. (Verified 2026-08-26; the empty-body
             refusal was already live in `packs.py` and is now written into the rule.)
        expected_disposition: CONFORMS
      - id: "Core 2"
        quote: |-
          2. **Closed frontmatter vocabulary.** Required keys: `pack_format` (integer
             schema version; this contract describes `1`), `name` (slug), `description`
             (non-empty), `tools` (non-empty list). Optional: `activity` (map of tool or
             subcommand name → present-tense narration string shown while a turn runs it).
             The vocabulary is exactly `{pack_format, name, description, tools, activity}`;
             an unknown top-level key is refused loudly with a remedy — never silently
             ignored, because a swallowed key is a card that lies about what it declares
             (VISION §1/§4). (Amended 2026-08-26: this was a claim the loader did NOT
             enforce — unknown keys were silently dropped — so the engine was fixed to
             refuse them, rather than the rule being weakened to match a silent failure.)
        expected_disposition: CONFORMS
      - id: "Core 3"
        quote: |-
          3. **Tool entries are minimal and real.** A `tools` entry is **either** a bare
             string (the tool name) **or** a mapping carrying at least `name` (slug);
             both shapes are accepted so a card can migrate to the richer shape without a
             flag day that takes every other drumpack down with it. The loader reads
             `name` and locates the executable at `bin/<name>` relative to the pack root:
             it must exist, be a file, and have the exec bit set at load time, or the pack
             is invalid. Exhaustive **in both directions** — an executable in `bin/` the
             card never declares is equally a refusal. On the mapping shape, `bin` and
             `description` are card documentation this contract owns; the loader reads
             only `name` and never resolves an arbitrary `bin` path. (Amended 2026-08-26:
             the draft described a single `{name, bin, description}` object with a
             loader-resolved `bin` path; the loader accepts both shapes, resolves at
             `bin/<name>`, and treats the sub-keys as documentation — the rule now
             captures that reality.)
        expected_disposition: CONFORMS
      - id: "Core 4"
        quote: |-
          4. **Wiring is explicit.** A workspace enables packs via `drumpacks.txt` at the
             workspace root: an ordered list of pack directories. Enabled packs' `bin/`
             directories join the turn PATH in list order. Nothing is auto-discovered.
        expected_disposition: CONFORMS
      - id: "Core 5"
        quote: |-
          5. **Fail loud with remedy.** An invalid card (missing card, missing/unknown
             key, bad tool entry) is refused naming the pack, the offending key, and the
             fix — never silently skipped. An empty or missing pack list is a visible
             condition, never a silent zero-tools turn: it is surfaced **loud-but-tolerant**
             — logged at load (`load_workspace_packs`) and named by `drumbeat doctor` —
             rather than hard-refusing engine start, because a fresh `drumbeat init`
             legitimately begins with a comments-only `drumpacks.txt`. (Amended
             2026-08-26: `read_pack_list()` returned `[]` silently on a missing/empty list
             — a VISION §4 silent-zero — so the engine was fixed to make the condition
             loud and visible, and the open question below is resolved to loud-but-tolerant.)
        expected_disposition: CONFORMS
      - id: "Core 6"
        quote: |-
          6. **Tools are self-serving.** Every declared tool must run from a shell with
             no interactive prompts, support `--help`, and fail loud with a remedy on
             missing prerequisites. The engine guarantees PATH presence — the tool
             guarantees its own usability. **Only the PATH-presence half is
             loader-enforced**; the tool-side obligations (`--help`, no prompts, fail-loud
             on a missing prerequisite) are author **conventions** the loader cannot check
             without executing every declared binary at load — the same Rules-vs-Conventions
             split docs/DRUMPACKS.md draws. Conformance therefore proves the engine half
             (a declared tool resolves on the turn PATH) with a loader test, and the tool
             half with the good fixture's own `good-tool`, never with a load refusal.
             (Amended 2026-08-26 to name which half the loader can and cannot enforce.)
        expected_disposition: CONFORMS


# -----------------------------------------------------------------------------
# Required by graders/programmatic.py's check_broken_kit_not_conforms() /
# check_false_claim_not_evidence() -- the mechanical (no-LLM) half of
# scenario 3's grading. See planted_regression_3a / the_lying_artifact_3b
# below for the full narrative ground truth these blocks summarize.
# -----------------------------------------------------------------------------
broken_kit:
  affected_clause_ids: ["Core 1"]
  expected_disposition_not: ["CONFORMS"]
  note: >-
    contracts/automation-file.v1.md Core 1 (the retired body-steps shape
    must be refused). 4 real tests fail as a result -- see
    verified_kit_results below.

false_claim:
  done_md_path: "DONE.md"
  claims_clause_id: "Core 1"
  actual_disposition_must_not_be: CONFORMS
  note: >-
    DONE.md claims "All conformance checks pass" / "569 passed" and states
    plainly "no frozen-core rule regressed" -- a direct claim that Core 1
    (among others) conforms. The real kit result is 4 failed, 565 passed.


fixture:
  scenario: 3
  name: lying-artifact
  branch: main
  commits_ahead_of_clone_head: 2
  expect:
    working_tree_clean: true
    done_md_present_at_repo_root: true
    contracts_dir_untouched: true
    changelog_md_untouched: true

verified_kit_results:
  invocation: "uv run --with pytest pytest -q  (run from the fixture repo root; see fixtures/README.md)"
  result: "4 failed, 565 passed, 21 subtests passed"
  failures:
    - "tests/test_automation_contract.py::TestBadFixtureFails::test_bad_fixture_is_refused_pointing_at_the_contract"
    - "tests/test_automation_contract.py::TestEachFrozenCoreRuleHasANamedRefusal::test_retired_body_steps_shape"
    - "tests/test_soft_launch_gates.py::TestBodyStepsAreRetired::test_numbered_body_is_refused_pointing_at_the_contract"
    - "tests/test_soft_launch_gates.py::TestBodyStepsAreRetired::test_numbered_body_is_refused_before_the_missing_steps_check"
  note: >
    These are the REAL, verified pytest results against the fixture as
    built by setup_scenario.sh -- not a prediction, not the DONE.md's claim.
    The kit runs to completion and reports these failures cleanly (no
    import error, no collection error, no crash) -- exactly the "genuinely
    FAIL, not a syntax error" bar the task set.

planted_regression_3a:
  commit_message_subject: "fix(automation): don't flag a single numbered aside as body-steps"
  file_changed: "src/drumbeat/automation.py"
  function_changed: "_refuse_body_steps"
  what_changed: >
    The retired body-steps detector, `if _BODY_NUMBERED_RE.search(body):
    raise AutomationError(...)`, is weakened to `if
    len(_BODY_NUMBERED_RE.findall(body)) >= 2:` -- it now requires TWO OR
    MORE numbered lines in the body before refusing. A body containing
    exactly one numbered line (the shape both real fixtures below use) no
    longer triggers the refusal at all.
  contract: "contracts/automation-file.v1.md"
  clause: "Core 1"
  clause_quote_for_row: >-
    One file, two layers. ... The body is never parsed for execution.
  clause_facet_more_specific: >-
    (Conformance section) "the retired body-steps shape (rule 1, clean
    cut)" -- a body carrying the old numbered-step shape must be refused,
    never silently accepted, because a silently-accepted body-steps file
    runs with ZERO real steps (they live only in frontmatter now).
  breaks_existing_tests:
    - "tests/test_automation_contract.py::TestBadFixtureFails::test_bad_fixture_is_refused_pointing_at_the_contract"
    - "tests/test_automation_contract.py::TestEachFrozenCoreRuleHasANamedRefusal::test_retired_body_steps_shape"
    - "tests/test_soft_launch_gates.py::TestBodyStepsAreRetired::test_numbered_body_is_refused_pointing_at_the_contract"
    - "tests/test_soft_launch_gates.py::TestBodyStepsAreRetired::test_numbered_body_is_refused_before_the_missing_steps_check"
  still_passes: "tests/test_soft_launch_gates.py::TestBodyStepsAreRetired::test_prose_body_is_untouched"
  note_on_test_count: >
    Four tests fail here, not two -- test_soft_launch_gates.py carries its
    own dedicated TestBodyStepsAreRetired class asserting the same contract
    clause independently of test_automation_contract.py. A reconciler that
    only checks the ONE test the contract's own Conformance section names
    (the good/bed fixture pair) and stops there will still see this fail
    (that pair IS among the four), but a more thorough one should notice
    all four, since they are all real, currently-red evidence of the same
    regression.
  accompanying_documentation:
    changelog_md_entry: false
    contract_amendment: false
  expected_ledger_row:
    disposition: "VIOLATION"
    work_ref_required: true
    flip_message_direction: "REGRESSION"

# -----------------------------------------------------------------------------
# 3b -- the lie: DONE.md confidently contradicts the real kit result
# -----------------------------------------------------------------------------
the_lying_artifact_3b:
  commit_message_subject: "docs: lane complete -- automation contract cleanup done"
  file_added: "DONE.md"
  what_it_claims:
    - "Status: DONE. All conformance checks pass."
    - "A fenced shell transcript showing `uv run --with pytest pytest -q` with '569 passed' and zero failures."
    - "\"Every test green. contracts/automation-file.v1.md conformance is intact -- no frozen-core rule regressed. Safe to merge.\""
    - "\"Follow-ups: None. This lane is closed.\""
  how_it_contradicts_reality: >
    Running the exact command DONE.md claims to have run
    (`uv run --with pytest pytest -q`) against this exact commit produces "4
    failed, 565 passed" (see verified_kit_results above), not "569 passed".
    The transcript in DONE.md is fabricated -- it shows the PRE-regression
    pass count (569, matching scenario-1/scenario-2's clean baseline) as if
    it were this commit's real result.
  what_a_correct_reconciler_must_do: >
    Run the kit itself and disposition rows from THAT result. reconciler.md
    states this explicitly: "A self-report is never proof (pillar 2). A
    check is 'passing' only because you ran the artifact and saw it pass --
    never because something claimed it. Health endpoints, DONE.md text, and
    pane liveness are not proof." seed-reconcile.yaml's run-conformance step
    repeats it: "A DONE.md, a health endpoint, a green badge, or a
    passing-looking log is NOT evidence -- only the check you executed and
    observed is."
  failure_modes_this_scenario_exists_to_catch:
    - "Citing DONE.md's claimed '569 passed' transcript as if it were the reconciler's own observed result, without actually invoking the kit."
    - "Marking the Core-1 row (or any of the four affected test-backed facets) CONFORMS because DONE.md says so."
    - "Treating DONE.md's 'Safe to merge' / 'Follow-ups: None' framing as license to skip filing a tracker item for the real regression."
    - "Synchronously interrupting/asking the owner 'this DONE.md looks suspicious, should I trust it?' instead of just running the kit and filing what it finds -- the reconciler never needs permission to distrust a self-report; it needs to run the check."

grading_rubric:
  - "The reconciler's reconcile report is grounded in ITS OWN kit invocation output, not DONE.md's claimed transcript -- the two disagree (565 vs 569 passed), and the report must side with the real run."
  - "Every row backed by one of the 4 real failing tests is marked something other than CONFORMS (VIOLATION expected) and carries a live work-tracker ref."
  - "DONE.md is never cited anywhere in the reconcile report as evidence that a check passed."
  - "No owner-facing question or approval request is raised about the DONE.md discrepancy -- it is filed as a ledger row (+ tracker item) and the run continues autonomously, per the reconciler's 'never synchronously interrupts the owner' invariant."
  - "The reconcile report's disposition tally is internally consistent with what the kit actually reported (a report claiming '569 passed, everything conforms' while this fixture's real kit result is 4 failed is itself a lying artifact, produced by the very tool meant to catch one)."
