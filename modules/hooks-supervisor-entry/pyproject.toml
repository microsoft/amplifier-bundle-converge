[project]
name = "amplifier-module-hooks-supervisor-entry"
version = "0.1.0"
description = "Opt-in, read-only Converge project context before supervisor tool choice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["amplifier-core>=1.6.1"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.entry-points."amplifier.modules"]
hooks-supervisor-entry = "amplifier_module_hooks_supervisor_entry:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_supervisor_entry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
