name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal read-only token -- no secrets needed or exposed.
# Safe for Dependabot PRs and external fork contributors.
permissions:
  contents: read

# There are no path-based trigger filters anywhere in this file, on purpose. A
# path filter that does not match leaves a required check permanently
# "expected", or silently absent, which is indistinguishable from a passing
# one. These jobs are seconds to a minute long; they run on every push and PR.
#
# No step swallows its exit code either: no error-suppressing job or step
# directive, and no shell fallback that discards a non-zero status. Every
# step's exit code is the gate.
#
# WHAT THIS GATE DOES *NOT* RUN, said out loud so a green tick is not read as
# more coverage than it is. Two of this repo's check suites are deliberately
# absent, each for a measured reason:
#
#   * ledger/checks/verify.py -- reads the work queue LIVE through
#     amplifier-work-tracker and fails loudly rather than passing on a stale
#     snapshot (converge-j0u5), and shells out to subprocess probes. It also
#     already exits 1 on clean main, on seven CLAUSE-N-STATE-CHANGED-REREAD
#     tripwires that are doing their job. It is a steward-facing ratchet, not
#     a pass/fail build gate.
#
#   * conformance/ (128 self-tests) -- conformance/composition/run.py uses
#     PEP 701 nested-quote f-strings, so it needs Python >= 3.12 while this
#     repo declares requires-python = ">=3.11". Measured: under 3.11 the kit
#     dies with `SyntaxError: unterminated string literal` at run.py:594 and
#     14 of the composition kit's 15 self-tests fail; under 3.12 and 3.13 it
#     parses and all 128 pass. Wiring it here on the declared floor would make
#     main red on day one over a defect that belongs to its own work item.
#     Reported in the PR body rather than hidden by narrowing the matrix.

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Lint -- pyflakes + pycodestyle errors across the repository.
  #
  # This repo carries no [tool.ruff] config and commits no root uv.lock (the
  # .gitignore says so explicitly, un-ignoring only the module's), so the
  # sibling template's `uv sync --frozen --only-group dev && uv run ruff`
  # shape does not apply. The tool and the rule set are both pinned here:
  #
  #   * ruff 0.16.6      -- pinned so a future ruff release cannot turn this
  #                         red without a visible change to this file. Same
  #                         pin as the sibling bundles notify, wayfinder and
  #                         browser-tester.
  #   * --isolated       -- ignore any ruff config, including one added later,
  #                         so the gate means the same thing every run.
  #   * --select E4,E7,E9,F
  #                      -- ruff's own classic default tier: pycodestyle
  #                         errors plus pyflakes (undefined names, unused
  #                         imports, f-string bugs). Real breakage, not style.
  #
  # NEITHER THE RULE SET NOR THE SCOPE IS NARROWED. No rule carve-out, no
  # path-exclusion flag, no per-file ignore: the whole repository is linted,
  # fixtures included. This repo's main was RED with 52 findings at 568cc77 and all 52
  # were fixed, as three named commits on this branch, rather than selected or
  # scoped away.
  #
  # The last four were F821 undefined-name inside conformance/*/fixtures --
  # synthetic sample repositories the kits read as evidence, one of them
  # defective on purpose. Excluding that tree was tried and REVERTED: an
  # exclusion is a narrowed scope, and it turned out to be unnecessary. Each was
  # fixed at its site with the fixture's judged behaviour left intact, proven by
  # running each kit against each fixture before and after and comparing every
  # row (good PASS -> PASS, bad FAIL -> FAIL, per-rule identical).
  #
  # `ruff format --check` is deliberately NOT run: at this commit it reports
  # 122 of 305 files would be reformatted. Reformatting the repository is a
  # far larger change than adding CI and is not this PR's job. Said in the PR
  # body, not left to look like coverage.
  # ────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `enable-cache:`. setup-uv keys its cache on **/uv.lock, and the one
      # lockfile in this tree belongs to a module, not the root -- a sibling
      # lane watched that turn its first red-proof run into a setup error
      # before ruff or pytest ever ran, which is a red that proves nothing.
      # These jobs install a handful of small wheels; the cache was never
      # worth the failure mode.
      - uses: astral-sh/setup-uv@v4

      - name: Lint (ruff 0.16.6, pinned)
        run: uvx ruff@0.16.6 check --isolated --select E4,E7,E9,F .

  # ────────────────────────────────────────────────────────────────────────
  # Tests -- root package. 139 real tests under tests/, exercising
  # src/amplifier_converge: the document/constraint/queue/lane/strip readers,
  # the four writes, the whatchanged differ, the plain-words surface rule, and
  # the live-queue tripwire. Not an import smoke.
  #
  # `--no-project --with-editable '.[app]'` rather than `uv sync`: the root commits no
  # lockfile on purpose, so there is nothing to sync and `--frozen` has
  # nothing to be frozen against. Source-resolution tests must import this
  # checkout, not an already-cached wheel module. Dedicated packaging tests
  # still build and exercise a real wheel in their own isolated environment.
  #
  # pyyaml is named explicitly. Without it the suite reports
  # "137 passed, 1 skipped" instead of 139 -- a test that quietly opts out is
  # exactly the kind of soft green this gate exists to prevent.
  # The app extra supplies the real authentication/TLS modules exercised by
  # test_project_state_probe (including PAM, itsdangerous and cryptography).
  # These dependencies remain optional for library users.
  #
  # The matrix is the floor and a current minor of the repo's declared
  # requires-python = ">=3.11", so the claim is checked at both ends rather
  # than taken on faith.
  # ────────────────────────────────────────────────────────────────────────
  test-root:
    name: Tests -- root (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Run the root suite
        run: >
          uv run --isolated --no-project
          --python ${{ matrix.python-version }}
          --with-editable '.[app]'
          --with 'pytest>=8.0'
          --with 'PyYAML>=6.0'
          python -m pytest tests/ -q --tb=short

  # ────────────────────────────────────────────────────────────────────────
  # Tests -- modules/hooks-candidate-guard. 132 real tests. This is the hook
  # that structurally denies write-shaped tool calls against a locked contract
  # (PROTOCOL.md section 5); AGENTS.md rule 2 leans on it, so a break here is
  # a break in the repository's own enforcement.
  #
  # This module DOES commit a uv.lock (the root .gitignore un-ignores exactly
  # this one), so it gets the `uv sync --frozen` treatment the root cannot:
  # the lockfile is used exactly as committed and the job fails if it would
  # need updating, which is what makes a Dependabot bump testable as proposed.
  #
  # `--extra dev` is required: pytest and pytest-asyncio live in the module's
  # dev extra, and a bare `uv sync --frozen` installs neither -- the run then
  # dies with "Failed to spawn: pytest", which reads as a setup error rather
  # than a test result.
  # ────────────────────────────────────────────────────────────────────────
  test-module:
    name: Tests -- hooks-candidate-guard (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install from the module's committed lockfile
        working-directory: modules/hooks-candidate-guard
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run the module suite
        working-directory: modules/hooks-candidate-guard
        run: uv run --frozen --python ${{ matrix.python-version }} pytest tests/ -q --tb=short

  # ────────────────────────────────────────────────────────────────────────
  # Bundle structure -- the YAML this bundle ships must parse and carry a
  # bundle.name. Nothing else in the repo checks bundle.md's frontmatter or
  # behaviors/*.yaml; a typo there breaks bundle load on a user's machine, not
  # here.
  #
  # Kept inline rather than as a checked-in script because this PR
  # deliberately adds no file to the repo other than this workflow and the
  # lane's own artifacts.
  #
  # Nothing is interpolated into the Python source below (no ${{ }} inside the
  # heredoc, and the heredoc delimiter is quoted) -- a repo path interpolated
  # into Python source is how a sibling repo turned a backslash-a into BEL and
  # got a silent empty result at exit 0.
  # ────────────────────────────────────────────────────────────────────────
  bundle-structure:
    name: Bundle structure (YAML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --quiet 'PyYAML>=6.0'

      - name: Parse bundle.md frontmatter and behaviors/*.yaml
        run: |
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          root = pathlib.Path.cwd()
          failures: list[str] = []
          checked = 0

          bundle_md = root / "bundle.md"
          if not bundle_md.is_file():
              failures.append("bundle.md is missing")
          else:
              text = bundle_md.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  failures.append("bundle.md: no YAML frontmatter (file does not open with '---')")
              else:
                  end = text.find("\n---", 3)
                  if end == -1:
                      failures.append("bundle.md: frontmatter opened but never closed")
                  else:
                      data = None
                      try:
                          data = yaml.safe_load(text[4 : end + 1])
                          checked += 1
                      except yaml.YAMLError as exc:
                          failures.append("bundle.md frontmatter: " + str(exc))
                      if data is not None:
                          name = data.get("bundle", {}).get("name") if isinstance(data, dict) else None
                          if not name:
                              failures.append("bundle.md frontmatter: missing bundle.name")
                          else:
                              print("OK  bundle.md  (bundle.name=" + str(name) + ")")

          behaviors = sorted((root / "behaviors").glob("*.yaml"))
          if not behaviors:
              failures.append(
                  "behaviors/*.yaml matched NOTHING -- a structure gate that checks zero files is decoration"
              )
          for path in behaviors:
              # .as_posix(), not str(): str() emits OS-native separators.
              rel = path.relative_to(root).as_posix()
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8"))
                  checked += 1
              except yaml.YAMLError as exc:
                  failures.append(rel + ": " + str(exc))
                  continue
              name = data.get("bundle", {}).get("name") if isinstance(data, dict) else None
              if not name:
                  failures.append(rel + ": missing bundle.name")
              else:
                  print("OK  " + rel + "  (bundle.name=" + str(name) + ")")

          print("")
          print(str(checked) + " YAML document(s) parsed.")
          if failures:
              print("")
              print("FAILURES:")
              for item in failures:
                  print("  - " + item)
              sys.exit(1)
          print("Bundle structure OK.")
          PY
