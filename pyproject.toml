[project]
name = "amplifier-converge"
version = "0.1.0"
description = "Converge — the companion web page beside your project: Direction and Operation, and the four things you can do."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]
app = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-pam>=2.0",
    "six>=1.16",
    "itsdangerous>=2.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
    "tmux-kit>=0.1",
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
amplifier-converge = "amplifier_converge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_converge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
