[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-converge-instructions"
version = "0.4.11"
description = "Converge collaborative supervisor and manager instruction resources"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/microsoft/amplifier-bundle-converge"

[tool.hatch.build.targets.wheel]
packages = ["src/converge_instructions"]

[project.optional-dependencies]
test = [
  "pytest>=8", "pytest-asyncio>=0.24",
  "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@2c0063a187181173dfe2438ce031079e8723f894",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true
