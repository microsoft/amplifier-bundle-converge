- id: CVG-065
  title: the protocol authority checks documents against this anatomy — a live-session claim, not a file
  contract:
    file: contracts/documents.v1.md
    clause: "Core 13"
    quote: "its protocol authority checks documents against it;"
  disposition: NOT-ASSERTABLE
  assertion:
    kind: probe
    ref: 'uv run conformance/documents/run.py . --json-only | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)[\"results\"] if x[\"id\"]==\"protocol_authority_checks_documents\"][0];print(\"AUTHORITY-CHECK-IS-A-LIVE-SESSION-CLAIM\" if r[\"status\"]==\"SKIP\" and \"live session\" in r[\"reason\"] else \"AUTHORITY-CHECK-NOW-IN-THE-TREE\")"'
    expect:
      exit: 0
      stdout_contains: "AUTHORITY-CHECK-IS-A-LIVE-SESSION-CLAIM"
  proves: >
    Only that rule 13b still declines, and still declines for being a claim
    about a running agent rather than about a file. It proves nothing about
    whether the authority does or does not check documents against the anatomy.
  justification: >
    RAN 2026-09-02: rule 13b (`protocol_authority_checks_documents`) reports
    SKIP — "clause 13 makes three promises and only two are files. That the
    protocol authority CHECKS documents against this anatomy is a claim about a
    running agent's behaviour in a live session, not about anything in the
    tree — the same class of promise the composition kit SKIPs as 'needs a live
    Amplifier session'."
  notes: >
    RAN 2026-09-02 → rule 13b SKIP → AUTHORITY-CHECK-IS-A-LIVE-SESSION-CLAIM.
    WAS GAP (work converge-nht) asserted by an absence probe over
    agents/protocol-authority.md. That probe was answering a weaker question
    than the clause asks: an agent file that NAMED the anatomy would have
    flipped it green without anyone observing the authority check a single
    document. The clause is about behaviour in a session; the tree cannot hold
    the evidence either way, so the disposition says so.
    WHAT WOULD MOVE THIS: an observed session in which the authority is given a
    document and reports it against documents.v1's anatomy, recorded by name
    and date — the same shape of evidence clause 12's human-reader assertion
    asks for. Not a file, and not this kit.
    MOVED BY converge-jc9, on this run and not on that item's mapping.

