- id: CVG-051
  title: a work item names its contract and defines done — the mechanical half, which cannot run here
  contract:
    file: contracts/documents.v1.md
    clause: "Core 9"
    quote: "**A work item names its contract** in one line, defines done in plain words,"
  disposition: GAP
  assertion:
    kind: probe
    ref: 'uv run conformance/documents/run.py . --json-only | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)[\"results\"] if x[\"id\"]==\"work_item_names_a_contract\"][0];n=len([f for f in r.get(\"files\",[]) if f[\"status\"]==\"FAIL\"]);print(\"WORK-ITEM-CHECK-CANNOT-RUN-NO-EXPORT\" if r[\"status\"]==\"SKIP\" and \"no work-item export\" in r.get(\"reason\",\"\") else \"WORK-ITEM-CHECK-NOW-RUNS-\"+r[\"status\"]+\"-ITEMS=\"+str(n))"'
    expect:
      exit: 0
      stdout_contains: "WORK-ITEM-CHECK-NOW-RUNS-FAIL-ITEMS=2"
  proves: >
    That rule 9a RUNS against this repository's exported queue, returns FAIL, and
    fails on exactly two items. It proves the promise is broken, not merely
    unchecked — and it now pins HOW broken, so the row moves when the breakage
    does, in either direction.
    THE COUNT IS PART OF THE PIN, DELIBERATELY. The verdict word alone could not
    tell 9-of-42 from 2-of-65: the queue got healthier by a factor of six and this
    row would have gone on quietly reporting FAIL, which is drift toward spec
    going unrecorded (LEDGER-FORMAT §3). Fixing the last two flips this row to
    PASS-ITEMS=0 and forces the re-read that turns it green; a new item that names
    no contract flips it the other way. Either way it cannot be silently enjoyed.
    THE READING THIS ROW USED TO CARRY, KEPT FOR THE RECORD —
    Only that rule 9a is present, mechanical, and still has nothing to read in
    this tree. It proves NOTHING about whether this repository's work items name
    their contract or define done in plain words — that is the promise, and it is
    unasserted here, which is what GAP says. The probe is written to flip the
    moment the gap closes: land a work-queue export and it reports
    WORK-ITEM-CHECK-NOW-RUNS-PASS or -FAIL instead, forcing this row to be
    re-derived rather than quietly enjoying a check that started passing.
  notes: >
    RAN 2026-09-03 (converge-njn) → rule 9a (`work_item_names_a_contract`) SKIP,
    "no work-item export at docs/work-items.json and none named with
    --work-items — work items live in the work queue, not in this tree, so the
    kit has nothing to read" → WORK-ITEM-CHECK-CANNOT-RUN-NO-EXPORT.
    QUOTE NARROWED AND THE ROW SPLIT 2026-09-03 by converge-njn. This row used to
    carry the WHOLE of clause 9 under one GAP, against `(rules 9a, 9b)`. After
    wave 4 the clause's two halves stopped being the same kind of thing:
    9a SKIPs for a MISSING SUBJECT (fixable — plain GAP), 9b SKIPs on a
    PUBLISHED MEASUREMENT (a refusal — NOT-ASSERTABLE). Keeping them in one row
    would publish one disposition over two different truths, which is the defect
    the cross-check found between CVG-048/CVG-049 and converge-jc9 fixed by
    splitting CVG-059 → CVG-067. The second half is now CVG-069, quoting the
    disjoint remainder of the sentence. Fresh id, per this file's never-renumber
    rule; this id keeps the half it was mostly about.
    WHY THIS HALF IS GAP AND NOT NOT-ASSERTABLE. Rule 9a is complete and
    mechanical: it asserts both promises the sentence makes — that an item names
    a contract which EXISTS in `contracts/`, by stem and version, and that its
    definition of done carries no machine state word. It declines only for want
    of a subject. Supply the export and it runs; converge-8om already ran it
    against the live 24-item queue and got a real FAIL (4 items named no
    contract, filed as converge-vc0). A check that works and has nothing to read
    is a gap with a named fix, not a refusal.
    THE FIX IS NOW FILED AND THIS ROW CITES IT. The `work` ref moved from
    converge-8om to converge-gmo. converge-8om is RESOLVED — it built these
    rules — and this file's own tally already says "a closed item may not stay
    cited as the thing that will fix a red row". converge-gmo is the open item
    for the export itself.
    THE PROBE REPLACED AN `indexed` REF, for the reason the third reconcile gives
    in the header: an `indexed` ref proves only that the rule exists. This one
    pins rule 9a's own verdict AND its reason, so it flips on every event that
    should move this row.
    NEGATIVE-CONTROLLED 2026-09-03 in a scratch copy of this tree, twice, each
    break observed to land and then restored: adding a `docs/work-items.json`
    export → WORK-ITEM-CHECK-NOW-RUNS-PASS; rewording rule 9a's SKIP reason →
    WORK-ITEM-CHECK-NOW-RUNS-SKIP. Renaming the rule id makes the probe exit 1
    rather than pass on a vanished rule (controlled on 9b, same probe shape).
    ─────────────────────────────────────────────────────────────────────────────
    THE CONTROL FIRED FOR REAL — RE-DERIVED 2026-09-03 (converge-pq2, the fourth
    reconcile). The export landed (converge-gmo, resolved), rule 9a ran, and the
    probe printed WORK-ITEM-CHECK-NOW-RUNS-FAIL where this row expected
    CANNOT-RUN-NO-EXPORT. That is the simulated fix arriving in the tree, and the
    row going red on movement TOWARD spec is exactly what LEDGER-FORMAT §3's
    bidirectional rule asks for. Nothing was quietly bumped: the row was re-read.
    STILL GAP, FOR A DIFFERENT AND BETTER REASON. Yesterday the clause was
    unchecked; today it is checked and broken — 9 of 42 items, e.g. converge-12o
    (does not define done in plain words), converge-5m8 and converge-8om (define
    done with the machine state word `GAP`), converge-bmp (`OPEN-PINNED`).
    THE `work` REF MOVED converge-gmo → converge-a5r, because this file's own rule
    says a closed item may not stay cited as the thing that will fix a red row.
    converge-a5r carries the nine, and carries the honest question inside them:
    most are items ABOUT the ledger, whose definition of done genuinely is a
    disposition. Whether clause 9's "plain words" admits a term of art is a
    documents.v1 question, not nine edits — the item says so rather than assuming.
    ────────────────────────────────────────────────────────────────────────────
    RE-DERIVED 2026-09-04 (converge-nf4, the reconcile after wave 7) →
    WORK-ITEM-CHECK-NOW-RUNS-FAIL-ITEMS=2. Rule 9a's own words:
    "2 of 65 work failed — converge-c4s: names no contract that exists in
    contracts/; converge-f1l: defines done with machine state word(s)
    ['NOT-ASSERTABLE'], not in plain words".
    THE ROW'S EXPECTATION WAS MET AND THE ROW WAS STILL WRONG. Wave 7 refreshed
    the export (commit c80e6ab) and the queue moved 9-of-42 failing to 2-of-65 —
    a real improvement, invisible to this row, because the old expectation pinned
    only the word FAIL. verify.py reported [OK] for it in the same run that
    failed three other rows. That is the quiet half of bidirectional drift: not a
    red row that should be green, but a red row whose reading has gone stale
    under an expectation too loose to notice. The probe was tightened rather than
    the note rewritten — a comment cannot flip.
    STILL GAP. Two items still fail, and they are two different kinds of failure:
    converge-c4s (a rendered-viewport bug found in the app) names no contract at
    all, which is the plain form of the breach; converge-f1l defines done with
    NOT-ASSERTABLE, which is a ledger item using the ledger's vocabulary — the
    exact term-of-art question converge-a5r already carries and declines to
    settle by editing nine items.
    converge-a5r IS STILL THE RIGHT CITE, AND ITS OWN TEXT IS NOW STALE. It is
    open, its acceptance is unchanged and still correct ("rule 9a reports PASS …
    or documents.v1 clause 9 carries a ratified sentence saying when a term of
    art is allowed"), but its description enumerates the nine failures of
    2026-09-03. Seven of those nine are gone. Whoever takes it should re-run the
    kit rather than work from the list in the item.
    NEGATIVE-CONTROLLED 2026-09-04, in a scratch export, both offenders corrected
    (converge-c4s given a contract line, converge-f1l's NOT-ASSERTABLE reworded)
    and the kit re-run against it with --work-items:
    WORK-ITEM-CHECK-NOW-RUNS-PASS-ITEMS=0, "all 65 work item(s) name a contract
    and define done". The committed export was not touched.
    THE CONTROL WAS NOT HYPOTHETICAL, AND THIS ROW WILL GO RED ON MERGE. SAY SO
    HERE RATHER THAN LET IT SURPRISE THE INTEGRATOR. This lane branched from
    c80e6ab; main has since moved to 0e5e942, "export refreshed — 9a PASS". Run
    against main's own export, read out of git and handed to the kit with
    --work-items (2026-09-04, read-only, nothing in this tree changed):
    WORK-ITEM-CHECK-NOW-RUNS-PASS-ITEMS=0, "all 66 work item(s) name a contract
    and define done". Both offenders were really fixed, not excused —
    converge-c4s gained "Contract: experience-console.v1 …", and converge-f1l's
    acceptance now says "can't check" where it said NOT-ASSERTABLE, which is the
    steward's plain word for the same verdict.
    WHY THIS ROW STILL SAYS 2 ANYWAY. A row asserts what its own tree can run.
    Pinning PASS-ITEMS=0 here would be pinning a state this working tree does not
    have — verify.py would fail on it immediately, and the pin would be a claim
    made from a diff rather than from a run. So the row records what was measured
    (2 of 65) and this note records what is coming.
    WHAT THE INTEGRATOR SHOULD DO, once these land together: run the probe. If it
    says PASS-ITEMS=0, clause 9's mechanical half is kept — re-derive this row to
    CONFORMS, drop the `work` ref (a green row carries none), and close
    converge-a5r, whose acceptance ("rule 9a reports PASS") is then met. If it
