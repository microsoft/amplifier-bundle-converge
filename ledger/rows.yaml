      stdout_contains: "INSTALLABLE-FROM-ITS-OWN-ORIGIN"
  notes: >
    Measured 2026-09-03 (converge-pq2). The app ships a web manifest and a
    service worker and links the manifest
    from its own base template, so it installs to a home screen with no app
    store. That installing changes ONLY the frame - the same app, without the
    browser's chrome - is not proved here; nothing compares the two.
- id: CVG-209
  title: "offline it reads what it last synced, and says when that was"
  contract:
    file: contracts/platform-web.v1.md
    clause: "Core 10"
    quote: |
      **Offline it reads what it last synced, and says when that was.** A small
      helper the browser keeps beside the app serves the documents already
      fetched, each marked with the moment it came from. Nothing that is not
  disposition: GAP
  assertion:
    kind: probe
    ref: 'grep -q ''is never written to the cache'' app/static/sw.js && echo API-NEVER-CACHED-SO-NOTHING-TO-READ-OFFLINE || echo SW-CACHING-CHANGED'
    expect:
      exit: 0
      stdout_contains: "API-NEVER-CACHED-SO-NOTHING-TO-READ-OFFLINE"
  notes: >
    Measured 2026-09-03 (converge-pq2). Read from the service worker's own
    stated rule: /api is network-first and
    never written to the cache. Offline the shell loads and every payload behind
    it is empty, so there is nothing that was 'last synced' to read and nothing
    that says when. The probe asserts the cause, so it flips the moment the
    caching policy changes in either direction.
  work: converge-719
- id: CVG-210
  title: "offline it refuses the five writes in a plain sentence"
  contract:
    file: contracts/platform-web.v1.md
    clause: "Core 11"
    quote: |
      **Offline it refuses the five writes in a plain sentence.** A browser cannot
      promise to send something later — the helper may never be woken, and on some
      browsers never is — so the app says the write is unavailable and names what
  disposition: GAP
  assertion:
    kind: probe
    ref: 'grep -q ''Could not'' app/static/js/actions.js && echo OFFLINE-WRITES-FAIL-AS-A-FETCH-ERROR || echo OFFLINE-REFUSAL-CHANGED'
    expect:
      exit: 0
      stdout_contains: "OFFLINE-WRITES-FAIL-AS-A-FETCH-ERROR"
  notes: >
    Measured 2026-09-03 (converge-pq2). A failed write surfaces as 'Could not
    record the decision: <message>' - a
    fetch error relayed to the reader, not a plain sentence saying the app is
    offline and the write will not happen. Two of the five writes do not exist
    at
    all (CVG-103), so this clause cannot be fully kept before that one is.
  work: converge-719
- id: CVG-211
  title: "the Manager Console is live or plainly disconnected, never in between"
  contract:
    file: contracts/platform-web.v1.md
    clause: "Core 12"
    quote: |
      **The Manager Console is live or plainly disconnected, never in between.**
      It is a view of a running session; when the connection drops it says so on
      its own face, and never leaves an old screen sitting there looking live.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: 'grep -q ''Connected'' app/static/js/render/console.js && grep -q ''Detached'' app/static/js/render/console.js && echo CONSOLE-STATE-IS-ONE-OF-TWO-WORDS || echo CONSOLE-STATE-CHANGED'
    expect:
      exit: 0
      stdout_contains: "CONSOLE-STATE-IS-ONE-OF-TWO-WORDS"
  notes: >
    Measured 2026-09-03 (converge-pq2). The console renders exactly one of two
    words - Connected or Detached - from
    one condition (a target AND the viewer being loaded), so there is no third,
    ambiguous state to be in. What a static read cannot prove is that the word
    tracks the connection in real time.
- id: CVG-212
  title: "everything it needs comes from its own origin"
  contract:
    file: contracts/platform-web.v1.md
    clause: "Core 13"
    quote: |
      **Everything it needs comes from its own origin.** No script, font, style,
      or image is fetched from anywhere else, so it works on a restricted network
      and on a laptop with no internet at all.
  disposition: CONFORMS
  assertion:
    kind: absence
    ref: 'if grep -rhoE ''(src|href)="https?://'' app/templates app/static/*.webmanifest 2>/dev/null | grep -q .; then echo LOADS-FROM-ANOTHER-ORIGIN; else echo EVERYTHING-FROM-ITS-OWN-ORIGIN; fi'
    expect:
      exit: 0
      stdout_contains: "EVERYTHING-FROM-ITS-OWN-ORIGIN"
  notes: >
    Measured 2026-09-03 (converge-pq2). No script, font, stylesheet or image is
    fetched from another origin - the
    terminal viewer that would normally come from a CDN is vendored at
    app/static/vendor/xterm/. An `absence` assertion, so the first off-origin
    reference flips this row red.
- id: CVG-213
  title: "it renders at 390 and 1280 pixels with nothing cut off and no errors"
  contract:
    file: contracts/platform-web.v1.md
    clause: "Core 14"
    quote: |
      **It renders at 390 and 1280 pixels with nothing cut off and no errors in
      the browser's own log.** Those two widths are the phone and the laptop this
      contract is written for; a body that fails either is not shipped.
  disposition: NOT-ASSERTABLE
  assertion:
    kind: none
  justification: >
    No conformance kit in this repository launches a browser, so nothing here
    can see a render, a cut-off element, or a console error. This is the row
    that
    CVG-202, CVG-203, CVG-205 and CVG-206 all point at: one browser at two
    widths
    would settle five clauses at once.
    WHAT EXISTS SHORT OF IT, and why neither is this row: the app asserts the
    same
    promise STRUCTURALLY against its own stylesheet in
    tests/test_renders_at_both_widths.py, and app/static/dev/verify.py drives a
    real Chromium at both widths against a stub server. The second is the shape
    this needs; it points at a stub rather than the running app, and it is not
    run
    by any kit.

