- id: CVG-001
  title: lean base, never the heavy package
  contract:
    file: contracts/composition.v1.md
    clause: "Core 1"
    quote: |
      Converge assembles its session from the small standard base (the *anchors*
      bundle in the Amplifier foundation repository)
  disposition: CONFORMS
  assertion:
    kind: indexed
    ref: conformance/composition/run.py (rules 1a, 1b, 1c)
  notes: >
    RAN 2026-09-02 `uv run conformance/composition/run.py .` → VERDICT PASS
    (7 pass / 0 fail / 2 skip). Rule 1a: no '@foundation:' reference across 6
    loaded files. Rule 1b: no 'foundation:' helper named in the 1 automated step
    file. Rule 1c: lean base named in bundle.md includes —
    `...amplifier-foundation@main#subdirectory=bundles/anchors/bundle.md`. The
    kit's sample-bad fixture fails all three, so the rules discriminate.

