# WHAT THE CROSS-CHECK CHANGED (2026-09-02, hours after the seed)
# ---------------------------------------------------------------
# converge:reconciler read this ledger cold and found that 13 of ~32 executable
# refs COULD NOT FAIL. The worst: nine surface rows shared
#     find . -name index.html -not -path ./conformance/* …
# with the glob UNQUOTED, so the shell expanded it, `find` died with "paths must
# precede expression", printed nothing, and `test -z ""` succeeded — printing
# NO-COMPANION-PAGE unconditionally, including on the day the companion page
# ships. Reproduced here before fixing: a scratch copy of this tree with
# `app/index.html` added still printed NO-COMPANION-PAGE; the quoted form printed
# COMPANION-PAGE-EXISTS. Those rows were right that day and would have been
# silently wrong the next.
# Fixed by: quoting every glob, giving every probe a distinctive token for BOTH
# outcomes, and adding `assertion.expect` so a ref is an assertion rather than a
# command. Also fixed: refs whose expectation sat in a `#` comment and so never
# ran (CVG-003, CVG-005), refs that could not notice the event that would flip
# them (CVG-008/009, CVG-044), and two refs that grepped a README's PROSE for
# coverage instead of the kit's emitted rule ids (CVG-052, CVG-053).
# This is the ratchet catching its own ledger on day one. It is recorded here
# rather than quietly repaired, because a silent repair is the thing this
# document exists to refuse.
