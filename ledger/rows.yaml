# ─────────────────────────────────────────────────────────────────────────────
# operation.v1 — 15 rows.  The contract names its own gate "**Red today** —
# this is the work list", and that is what the ledger shows: 14 of 15 GAP.
#
# The manager mode encodes every clause; nothing OBSERVES a manager session
# keeping one.  Every GAP row's probe passes and proves only the encoding —
# read `proves` before trusting any green here.
#
# GAP IS THE RIGHT WORD, RULED 2026-09-02 (converge:protocol-authority):
# §3.3's "no implementation" reads against §5's Freeze Bar, where conditions 2
# and 3 are separate — a kit exists AND an implementation passes it. The
# protocol's working notion of an implementation is a thing that PASSES A KIT,
# not a thing that exists. CONFORMS would credit an agent's own instruction file
# as proof of its own compliance, which is the purest form of what §7 resists.
# Recorded as evidence for the next negotiation, NOT filed: §3.3's wording does
# not distinguish "unbuilt" from "built-but-unobserved", and 14 rows in the very
# first seed hit that. PROTOCOL.md is RATIFIED; changing it is a §5 CANDIDATE
# that only the owner ratifies, and one seed does not clear the evidence bar.
# ─────────────────────────────────────────────────────────────────────────────

- id: CVG-010
  title: turnkey gate — the operation contract's conformance kit has never run green
  contract:
    file: contracts/operation.v1.md
    clause: "Conformance kit asserts, Turnkey"
    quote: "**Red today** — this is the work list."
  disposition: CONFORMS
  assertion:
    kind: absence
    ref: 'if [ -f evaluations/turnkey/run.py ] && grep -q "Verdict: GREEN" evaluations/turnkey/RESULT.md; then echo TURNKEY-EXISTS-AND-IS-GREEN; else echo TURNKEY-STATE-CHANGED-REREAD-THIS-ROW; fi'
    expect:
      exit: 0
      stdout_contains: "TURNKEY-EXISTS-AND-IS-GREEN"
  notes: >
    RAN 2026-09-02 → TURNKEY-EXISTS-AND-IS-RED. THE CAUSE CHANGED THIS SESSION and
    the change is recorded rather than absorbed. At seed the harness did not exist
    at all. It does now (commit efbe453, converge-qtp): `evaluations/turnkey/run.py`,
    with fixtures, profiles and 30 of its own tests. I ran its self-check myself —
    `uv run evaluations/turnkey/run.py --self-check` → VERDICT PASS, 16 of 16
    assertions behave as specified — so the harness is real, not a stub.
    ITS RECORDED VERDICT IS RED, BOTH MODES: `evaluations/turnkey/RESULT.md`,
    "**Verdict: RED.** Both modes, exit 1" — observed mode 6 pass · 2 fail · 1 skip,
    driven mode 3 pass · 6 fail · 0 fail-free. So the contract's own sentence,
    "**Red today** — this is the work list", is now a measured statement rather
    than an admission.
    I DID NOT RE-RUN THE WAVE ITSELF. RESULT.md is another lane's transcript, and
    this ledger does not credit a lane's self-report as evidence (see the header).
    It is cited below as recorded context, never as a pass, and no operation row
    below flips on it. Re-running the observed mode is what would let them flip.
    THE HARNESS'S OWN NAMED LIMIT, worth carrying: in driven mode it "drives the
    environment, not the wave" — it stands up a container, installs, starts a
    project and seeds a gap, then judges whatever happened. Steps (e)–(i) fail
