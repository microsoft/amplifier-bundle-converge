# no state for "a sound, discriminating check exists but there is no subject to
# check" — CONFORMS would claim a pass that never ran, GAP would file work nobody
# owes (which operation.v1 Core 1 forbids), NOT-ASSERTABLE would tell a reader not
# to build a check that is already built. OPEN-PINNED was borrowed for its
# CONSEQUENCE ("revisited at negotiation"), not its definition, with the borrowing
# disclosed in the row. converge:protocol-authority ruled that reading, and ruled
# AGAINST proposing a seventh disposition on one row's evidence; promotion trigger
# named as "the second vacuous-subject row, or the first reader who misreads one
# as an undecided call."
# Neither has happened. The row's own re-read trigger fired instead — a proposal
# landed, the check ran, and CVG-050 is a plain CONFORMS. No row borrows the word
# today; the three remaining OPEN-PINNED rows (CVG-044, CVG-046, CVG-060) all fit
# its definition: an undecided call whose current behaviour is pinned by a check.
# The note stays for the next one.
#
