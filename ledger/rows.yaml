# WHAT THIS REPO OWES
# -------------------
# This repo is the contract HOME (contracts/), the reference implementation of
# three of the four contracts, and the conformance KITS (conformance/). Its
# checkable surface is therefore: does Converge itself keep the four promises it
# publishes? documents.v1 Core 13 makes that explicit — "Converge is
# self-hosting … its own repository passes the same kit."
#
# What this repo does NOT owe: rows about whether some OTHER project that adopts
# Converge conforms. Per-consumer rows live in the consumer repo's own
# ledger/rows.yaml, derived from the same contracts. A repo that installs
# Converge seeds its own ledger; nothing here speaks for it.
#
# Every disposition below was earned by a command RUN on 2026-09-02 against this
# tree — never by reading a DONE.md, a resolution note, or a lane's self-report.
# Where a check could not be run, the row says so in those words and carries a
# live tracker ref instead of a quiet pass.
#
# HOW TO READ A ROW
# -----------------
#   disposition   what is true of the CLAUSE today
#   assertion     the command or test that watches it
#   expect        what that command must print for the disposition to hold.
#                 THE ROW IS RED WHEN THE COMMAND STOPS PRINTING THIS.
#   proves        present ONLY when the assertion proves something NARROWER than
#                 the row's disposition claims — read it before trusting a green.
#                 Its ABSENCE is meaningful: on the other rows the assertion's
#                 pass/fail IS the disposition's truth condition. (Of the 22 GAP
#                 rows with a passing probe, 13 carry `proves` — the operation
#                 clauses, where the probe reads a mode file. The other 9 assert
#                 the gap itself: "the rule is still absent", "the rule still
#                 SKIPs".)
#   work          the tracker item that closes a red row
#
# `expect` exists because of a failure this ledger caught in itself on its first
# day — see WHAT THE CROSS-CHECK CHANGED. A `ref` without an `expect` is a
# command, not an assertion.
#
# THREE DEVIATIONS FROM LEDGER-FORMAT, DECLARED
# ---------------------------------------------
# LEDGER-FORMAT is a DRAFT convention whose own charter says "adopting repos may
# deviate freely — deviations are data for v1." Three deviations here:
#
#   1. `assertion.kind: probe` cites an exact SHELL COMMAND, not a function in
#      ledger/checks/. This repo has no ledger/checks/ yet; its executable
#      assertions live in conformance/ (three kits) and in module test suites.
#      THIS WAIVES MORE THAN THE REF FORMAT, and the waiver is the point:
#        - §1's "In-process only: no LLM, no network, no subprocess" — every
#          probe here is a subprocess, several are `uv run` (seconds, not the
#          ~0.25s §1's rationale rests on). "Slow ledgers don't get run" is a
#          real risk this accepts.
#        - §2's "bidirectional probe↔row-id cross-check enforced" — the format's
#          only mechanized integrity guarantee. A command string cannot join to
#          a row id. `assertion.expect` is the replacement, and it is weaker.
#      PROMOTION: when a clause gains a durable kit rule, its row moves to
#      `kind: indexed` pointing into conformance/.
#
#   2. A GAP row may carry a probe that PASSES. The probe proves the narrower
#      thing `assertion.proves` names, never the clause. This is structural, not
#      prose: LEDGER-FORMAT §5 generates flip messages "from row fields by one
#      shared helper", and on such a row the probe going red means "the mode
#      stopped encoding the clause", not "REGRESSION against Core 1". A helper
#      that reads `proves` can say the true thing; a helper that reads only
#      `disposition` cannot. LEDGER-FORMAT §8 ("Honest limits") is the rule this
#      follows.
#
#   3. A row whose subject lives OUTSIDE this repository pins that subject in the
#      row, as `subject:` (path + repo@sha + sha256). LEDGER-FORMAT §4 pins
#      contract files and is SILENT on an out-of-repo artifact a row's assertion
#      depends on. Silence, not permission: without the pin, CVG-037 goes
#      silently wrong in either direction the moment that file is edited, and
#      nothing in this repo's history records the change. Pinned in the ROW and
#      not in CVG-000 because the blast radii differ — a contract-hash mismatch
#      means re-review the whole ledger; this means re-read one row. Ruled by
#      converge:protocol-authority 2026-09-02. This is the deviation that closes
#      a SOUNDNESS hole rather than a stylistic one, and it is the strongest
#      evidence this seed produced for LEDGER-FORMAT v1's promotion trigger.
#
