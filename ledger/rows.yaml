# `app/index.html` added still printed NO-COMPANION-PAGE; the quoted form printed
# COMPANION-PAGE-EXISTS. Those rows were right that day and would have been
# silently wrong the next.
# Fixed by: quoting every glob, giving every probe a distinctive token for BOTH
# outcomes, and adding `assertion.expect` so a ref is an assertion rather than a
