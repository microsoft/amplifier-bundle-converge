# WHY NINE ROWS AND NOT ONE PER CONTRACT: the coverage tripwire
# (LEDGER-FORMAT section 6.1) asks that every Core clause be cited by at least
# one row, and it is right to. A single row saying 'this contract has no body'
# would hide the day one clause becomes checkable while the rest do not - which
# is exactly what happens first, because clause 9 of each ('what this platform
# cannot do is said, not hidden') becomes checkable the moment a body says
# anything at all.
