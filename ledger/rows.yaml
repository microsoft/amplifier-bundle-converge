# Neither has happened. The row's own re-read trigger fired instead — a proposal
# landed, the check ran, and CVG-050 is a plain CONFORMS. No row borrows the word
# today; the three remaining OPEN-PINNED rows (CVG-044, CVG-046, CVG-060) all fit
