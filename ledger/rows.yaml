    than an admission.
    I DID NOT RE-RUN THE WAVE ITSELF. RESULT.md is another lane's transcript, and
    this ledger does not credit a lane's self-report as evidence (see the header).
    It is cited below as recorded context, never as a pass, and no operation row
    below flips on it. Re-running the observed mode is what would let them flip.
    THE HARNESS'S OWN NAMED LIMIT, worth carrying: in driven mode it "drives the
    environment, not the wave" — it stands up a container, installs, starts a
    project and seeds a gap, then judges whatever happened. Steps (e)–(i) fail
    there because no manager session runs. That limit is the contract's red gate
    restated honestly, not a harness defect.
    THIS ROW IS THE ROOT OF THE 13 CLAUSE GAPS BELOW (CVG-011..CVG-023). They
    share one cause, so they share one tracker item rather than 13 near-duplicate
    ones — which is what operation.v1 Core 4 itself demands of any report intake.
