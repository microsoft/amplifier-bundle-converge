  assertion:
    kind: none
  justification: >
    No machine check can stand in for a person. The contract's own kit assert says
    what the check is — "A reader who is not an engineer reads each document here
    and reports nothing they had to look up — recorded by name and date" — and the
    documents kit reports rule 7 SKIP in the same terms: "needs a named human
    reader and a date; no file scan can stand in for a person reporting what they
    had to look up" (RAN 2026-09-02). Judgment-only, named as such, reviewed at
    cadence — never silently trusted. Closing this needs a named reader and a
    date, which is one of the four calls that reach the steward (operation.v1
    Core 11: "a check only a person or device can perform").

