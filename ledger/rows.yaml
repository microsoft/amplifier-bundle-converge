# Conformance ledger — amplifier-bundle-converge (Converge's OWN repository)
# Format: docs/LEDGER-FORMAT.md §1–2. Top-level YAML LIST of row mappings.
# SEEDED 2026-09-02 (converge-5m8, SEED mode). Repo @ 2543e1c.
#
# WHAT THIS REPO OWES
# -------------------
# This repo is the contract HOME (contracts/), the reference implementation of
# three of the four contracts, and the conformance KITS (conformance/). Its
# checkable surface is therefore: does Converge itself keep the four promises it
# publishes? documents.v1 Core 13 makes that explicit — "Converge is
# self-hosting … its own repository passes the same kit."
#
# What this repo does NOT owe: rows about whether some OTHER project that adopts
# Converge conforms. Per-consumer rows live in the consumer repo's own
# ledger/rows.yaml, derived from the same contracts. A repo that installs
# Converge seeds its own ledger; nothing here speaks for it.
#
# Every disposition below was earned by a command RUN on 2026-09-02 against this
# tree — never by reading a DONE.md, a resolution note, or a lane's self-report.
# Where a check could not be run, the row says so in those words and carries a
# live tracker ref instead of a quiet pass.
#
# TWO DEVIATIONS FROM LEDGER-FORMAT, DECLARED
# -------------------------------------------
# LEDGER-FORMAT is a DRAFT convention whose own charter says "adopting repos may
# deviate freely — deviations are data for v1." Two deviations here:
#
#   1. `assertion.kind: probe` cites an exact SHELL COMMAND, not a function in
#      ledger/checks/. This repo has no ledger/checks/ yet; its executable
#      assertions live in conformance/ (three kits) and in module test suites.
#      Every `probe` ref below is a command that runs from the repo root and was
#      run at seed. PROMOTION: when a clause gains a durable kit rule, its row
#      moves to `kind: indexed` pointing into conformance/.
#   2. A GAP row may carry a probe that PASSES. That is not a contradiction: the
#      probe proves the narrower thing its `notes` names (e.g. "the manager mode
#      encodes this clause"), never the clause itself. Each such row states in
#      notes exactly what the probe does and does not prove. LEDGER-FORMAT §8
#      ("Honest limits") is the rule this follows.
#
# ROW COUNTS BY CONTRACT (see the tally at the foot of this file)
#   composition.v1  8 rows (7 Core clauses + 1 live-harness bullet)
#   operation.v1   15 rows (13 Core clauses + declared dependencies + turnkey)
#   surface.v1     10 rows (10 Core clauses)
#   documents.v1   16 rows (13 Core clauses; 3 clauses split where two halves
#                           carry different dispositions)
#   + CVG-000 SYNC                                            = 50 rows total
#
# No row exists that a contract clause (or a sentence of a contract's own
# "Conformance kit asserts" / "Declared dependencies" section) does not back.
# The "What v1 deliberately does NOT freeze" and "Reserved / open questions"
# sections are explicitly not law and get no rows.
#
# ALL FOUR CONTRACTS ARE (DRAFT) TODAY. None is locked. Two consequences:
#   - The Freeze Bar has not been run against any of them; CONFORMS here means
#     "this draft clause is kept today", not "a frozen clause is kept".
#   - `VIOLATION` is defined against a frozen clause. CVG-037 uses it anyway,
#     for an implementation that contradicts a DRAFT clause, and says so in its
#     notes. The alternative — silence — would be the ledger lying.

