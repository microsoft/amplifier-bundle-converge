  contract:
    file: contracts/composition.v1.md
    clause: "Core 3"
    quote: |
      **Its own helpers carry a small local rulebook** — stop honestly when a
      thing cannot be proven; sign commits; cite locations — and borrow nothing
      else.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: 'n=$(grep -l "context/shared/agent-base.md" agents/*.md | wc -l); f=$(grep -hc "@foundation" agents/*.md | paste -sd+ - | bc); if [ "$n" = 4 ] && [ "$f" = 0 ]; then echo RULEBOOK-LOCAL-AND-COMPLETE; else echo "RULEBOOK-DRIFT agents=$n foundation-refs=$f"; fi'
    expect:
      exit: 0
      stdout_contains: "RULEBOOK-LOCAL-AND-COMPLETE"
  notes: >
    RAN 2026-09-02 → RULEBOOK-LOCAL-AND-COMPLETE. All 4 agents
    (amendment-drafter, negotiator, protocol-authority, reconciler) point at
    @converge:context/shared/agent-base.md, and 0 of them carry an '@foundation'
    reference — the "borrow nothing else" half. The rulebook carries exactly the
    three sections the clause names: `grep -n '^## '
    context/shared/agent-base.md` → "Stop honestly" (:7), "Cite locations" (:26),
