    ref: '[ -f app/static/manifest.webmanifest ] && [ -f app/static/sw.js ] && grep -q ''manifest.webmanifest'' app/templates/base.html && echo INSTALLABLE-FROM-ITS-OWN-ORIGIN || echo NOT-INSTALLABLE'
    expect:
