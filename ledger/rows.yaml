- id: CVG-064
  title: what each participant-kit file must contain — only presence is checked
  contract:
    file: contracts/documents.v1.md
    clause: "Core 12"
    quote: |
      a contracts README (anatomy, index, freeze bar, how to propose), an
      `AGENTS.md` addendum (converge toward the vision; never edit a locked
      contract; propose instead; where the ledger is; how to run conformance), a
      pins file of hard facts every lane reads first, and a pre-push scan that
      refuses edits to locked contracts.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: 'uv run conformance/documents/run.py . --json-only | python3 -c "import json,sys;r=[x for x in json.load(sys.stdin)[\"results\"] if x[\"id\"]==\"participant_kit_carries_its_content\"][0];print(\"KIT-CONTENT-RULE-PASSES-ON-\"+str(len(r[\"files\"]))+\"-FILES\" if r[\"status\"]==\"PASS\" else \"KIT-CONTENT-RULE-\"+r[\"status\"])"'
    expect:
      exit: 0
      stdout_contains: "KIT-CONTENT-RULE-PASSES-ON-3-FILES"
  proves: >
    That THREE of the four files this clause enumerates carry the topics it
    names for them — docs/CONTRACTS-README.md (4 topics), AGENTS.md (5), and
    .githooks/pre-push (2). PINS.md is not among them: the clause asks it for
    "hard facts every lane reads first", which enumerates no topic a scan could
    look for, so only its PRESENCE is asserted (rule 12a). The kit's README
    states that exclusion and why. Read this before the green: an empty PINS.md
    would still pass, and no row anywhere claims otherwise.
  notes: >
    RAN 2026-09-02 → rule 12c (`participant_kit_carries_its_content`) PASS,
    "all 3 participant-kit file(s) carry what clause 12 asks of them", each
    reporting `topics_absent: []` → KIT-CONTENT-RULE-PASSES-ON-3-FILES. WAS GAP
    (work converge-nht) — "an empty AGENTS.md would pass". It no longer would.
    NOT SPLIT, unlike CVG-059/CVG-067, and the difference is in the clause: for
    the brief, clause 2 states a measurable property with no subject in the
    tree, so a second row can say something true. For the pins file, clause 12
    states no checkable content at all, and its presence IS asserted — a
    second row would have nothing to assert that rule 12a does not already.
    The narrowing is disclosed in `proves` instead, which is what that field is
    for.
    THE FILE COUNT IS IN THE EXPECTATION ON PURPOSE: a rule that quietly
    stopped reading one of the three would still say PASS. It goes red at 2.
    MOVED BY converge-jc9, on this run and not on that item's mapping.

