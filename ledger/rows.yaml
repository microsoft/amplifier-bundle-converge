  disposition: GAP
  assertion:
    kind: absence
    ref: 'if [ -f evaluations/turnkey/run.py ] && grep -q "Verdict: RED" evaluations/turnkey/RESULT.md; then echo TURNKEY-EXISTS-AND-IS-RED; else echo TURNKEY-STATE-CHANGED-REREAD-THIS-ROW; fi'
    expect:
      exit: 0
      stdout_contains: "TURNKEY-EXISTS-AND-IS-RED"
  notes: >
    RAN 2026-09-02 → TURNKEY-EXISTS-AND-IS-RED. THE CAUSE CHANGED THIS SESSION and
    the change is recorded rather than absorbed. At seed the harness did not exist
    at all. It does now (commit efbe453, converge-qtp): `evaluations/turnkey/run.py`,
    with fixtures, profiles and 30 of its own tests. I ran its self-check myself —
    `uv run evaluations/turnkey/run.py --self-check` → VERDICT PASS, 16 of 16
    assertions behave as specified — so the harness is real, not a stub.
